:root{--board:#21403A;--board2:#2E564D;--chalk:#F3F0E4;--paper:#FBF7EE;--paper2:#EFE6D3;--ink:#1D1B19;--muted:#6E675C;--teal:#1F8A7A;--teal2:#156257;--amber:#F0B640;--red:#C8424E;--wood:#7A4E2E;
 --fH:"Bitter",Georgia,serif;--fB:"Fira","Avenir Next","Helvetica Neue",Arial,sans-serif;--fM:"AMono",Menlo,"Courier New",monospace;--sh:0 10px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0E1A18;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--fB);color:var(--ink)}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
b,strong{font-weight:700}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:810px;transform-origin:center center;overflow:hidden;background:#1B2E2B}
#scene{position:absolute;inset:0}
#scene>svg{position:absolute;inset:0}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;height:60px;display:flex;align-items:center;gap:10px;padding:0 12px;z-index:20;pointer-events:none;background:linear-gradient(#1A302C,#1A302CE0 70%,#1A302C00)}
#hud>*{pointer-events:auto}
.tag{background:var(--paper);border-radius:12px;padding:3px 14px;font-weight:600;font-size:18px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.3)}
#loc{background:transparent;color:var(--chalk);font-family:var(--fH);font-weight:800;font-size:20px;box-shadow:none;padding:0 6px}
#task{flex:1;overflow:hidden;text-overflow:ellipsis;font-size:17px;background:rgba(251,247,238,.92)}
#atp{background:linear-gradient(#FFD877,#E9A92B);color:#3A2500;font-weight:700}
#atp.low{background:linear-gradient(#FF8C8C,#C8424E);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.hbtn{border:none;background:var(--paper);border-radius:12px;font-weight:700;font-size:18px;padding:6px 14px;box-shadow:0 3px 8px rgba(0,0,0,.3);position:relative;min-height:44px}
.hbtn:active{transform:translateY(2px)}
.badge{position:absolute;top:-9px;right:-9px;background:var(--red);color:#fff;border:2px solid #fff;border-radius:50%;font-size:13px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700}
/* Inventar */
#inv{position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(#6B4428,#4A2E1A);border-top:3px solid #2B1A0E;box-shadow:0 -6px 18px rgba(0,0,0,.4);display:flex;align-items:center;gap:14px;padding:0 150px 0 14px;z-index:20}
#inv .lab{color:#F3DDBF;opacity:.6;font-family:var(--fH);font-weight:800;font-size:13px;letter-spacing:2px;writing-mode:vertical-rl;transform:rotate(180deg)}
.slot{height:74px;min-width:212px;background:linear-gradient(#FFFDF7,#EFE6D3);border-radius:12px;display:flex;align-items:center;gap:8px;padding:4px 12px;position:relative;touch-action:none;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.slot.sel{box-shadow:0 0 0 4px var(--amber),0 4px 10px rgba(0,0,0,.4);transform:translateY(-6px)}
.slot.lifted{opacity:.35}
.slot svg{width:64px;height:54px;flex:none}
.slot .nm{font-weight:700;font-size:18px;line-height:1.05}
.slot .bd{display:flex;gap:4px;margin-top:4px}
.slot .bd span{font-size:12px;font-weight:600;border-radius:6px;padding:0 6px;background:#E2DACA;color:#8a8170}
.slot .bd span.ok{background:#CDEBE4;color:#145A50}
.slot .lupe{position:absolute;right:-12px;top:-14px;width:38px;height:38px;border-radius:50%;border:none;background:#fff;font-size:16px;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.empty{color:#F3DDBF;opacity:.7;font-size:17px;line-height:1.25}
#btnG{position:absolute;right:12px;bottom:8px;width:128px;height:128px;border-radius:50%;border:4px solid #F3F0E4;background:var(--board);z-index:25;padding:0;box-shadow:0 8px 20px rgba(0,0,0,.5);overflow:visible}
#btnG img{width:100%;height:100%;object-fit:cover;border-radius:50%}
#btnG .q{position:absolute;left:-10px;top:-8px;background:linear-gradient(#FFD877,#E9A92B);border-radius:10px;padding:2px 10px;font-weight:700;font-size:16px;transform:rotate(-8deg);box-shadow:0 2px 6px rgba(0,0,0,.4)}
#btnG:active{transform:translateY(3px)}
/* Hotspots */
.hot{position:absolute;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;z-index:5}
.hot .av{width:100%;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;will-change:transform}
.hot .av svg{width:100%;height:100%;overflow:visible}
.hot.npc .av{animation:sway 3.6s ease-in-out infinite}
.hot:nth-child(odd) .av{animation-delay:-1.7s}
.hot .lbl{margin-top:2px;background:rgba(251,247,238,.95);border-radius:8px;padding:1px 10px;font-weight:700;font-size:16px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.35);line-height:1.45}
.hot.zone .lbl{background:rgba(255,236,186,.96)}
.hot.zone::before{content:"";position:absolute;top:2px;right:4px;width:22px;height:22px;border-radius:50%;background:radial-gradient(#fff,#FFD877 45%,transparent 70%);animation:ping 1.8s ease-in-out infinite}
.hot.go .lbl{background:linear-gradient(#25A08E,#156257);color:#fff;font-size:19px;padding:5px 16px}
.hot.target .lbl,.hot.over .lbl{background:var(--amber)}
.hot.over{outline:3px dashed var(--amber);outline-offset:4px;border-radius:14px}
.hot.drag .lbl::after{content:" ✥";opacity:.55}
.hot.lifted{opacity:.3}
.hot:active{transform:scale(.97)}
@keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes ping{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.ghost{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;filter:drop-shadow(0 10px 10px rgba(0,0,0,.45))}
.ghost svg{width:100px;height:106px}
.ghost .lbl,.ghost span,.ghost .nm,.ghost .bd,.ghost .lupe{display:none}
.ghost .av{width:116px;height:124px}
/* Dialog */
#dlgWrap{position:absolute;inset:0;z-index:60;display:none}
#dlgWrap.on{display:block}
#dlg{position:absolute;left:16px;right:16px;bottom:12px;min-height:180px;background:linear-gradient(#FFFDF7,#F4ECDB);border-radius:18px;box-shadow:0 14px 36px rgba(0,0,0,.55);display:flex;gap:18px;padding:16px 22px 34px 16px;border:1px solid #CDBF9F}
#dlgAv{width:148px;height:148px;flex:none;border-radius:14px;background:radial-gradient(#3A6158,#1E3631);overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),0 4px 10px rgba(0,0,0,.3)}
#dlgAv svg,#dlgAv img{width:100%;height:100%;object-fit:cover}
#dlgName{display:inline-block;color:#fff;font-weight:700;font-size:16px;padding:2px 12px;border-radius:8px;letter-spacing:.2px}
#dlgText{font-size:24px;line-height:1.32;margin-top:8px}
#dlgMore{position:absolute;right:22px;bottom:7px;font-size:15px;font-weight:600;opacity:.5}
#dlgChoices{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.choice,.btn{border:none;background:linear-gradient(#FFF6DF,#EADBB8);border-radius:12px;font-weight:700;font-size:20px;padding:9px 20px;box-shadow:0 4px 0 #B8A57E,0 6px 12px rgba(0,0,0,.25);min-height:52px;color:var(--ink)}
.choice{background:linear-gradient(#FFD877,#E9A92B);box-shadow:0 4px 0 #A87412,0 6px 12px rgba(0,0,0,.25)}
.btn.primary{background:linear-gradient(#25A08E,#156257);color:#fff;box-shadow:0 4px 0 #0D3F38,0 6px 12px rgba(0,0,0,.25)}
.btn.warn{background:linear-gradient(#E05A66,#A8303C);color:#fff;box-shadow:0 4px 0 #6E1A24,0 6px 12px rgba(0,0,0,.25)}
.btn.amber{background:linear-gradient(#FFD877,#E9A92B);box-shadow:0 4px 0 #A87412,0 6px 12px rgba(0,0,0,.25)}
.choice:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a7a5a}
.btn:disabled{opacity:.4}
.btn.help{background:#2E564D;color:#fff;box-shadow:0 4px 0 #142A25;font-size:18px}
/* Modal */
#modal{position:absolute;inset:0;z-index:40;background:rgba(8,16,14,.62);display:none;align-items:center;justify-content:center}
#modal.on{display:flex}
.mbox{background:linear-gradient(#FFFDF7,#F5EEDF);border-radius:20px;width:1024px;max-height:786px;padding:0 24px 18px;position:relative;overflow-y:auto;overflow-x:hidden;box-shadow:var(--sh);-webkit-overflow-scrolling:touch}
.mbox h2{margin:0 -24px 10px;padding:12px 70px 10px 24px;font-family:var(--fH);font-weight:800;font-size:28px;line-height:1.15;color:var(--chalk);background:linear-gradient(#2E564D,#21403A);position:sticky;top:0;z-index:4}
.mbox .sub{margin:2px 0 10px;font-size:20px;line-height:1.32}
.mbox .x{position:absolute;right:14px;top:8px;width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.92);font-size:22px;font-weight:700;z-index:6}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
/* Lernkarte */
#learn{position:absolute;inset:0;z-index:58;background:rgba(8,16,14,.7);display:none;align-items:center;justify-content:center}
#learn.on{display:flex}
.lcard{width:900px;max-height:780px;overflow-y:auto;background:linear-gradient(#FFFDF7,#F5EEDF);border-radius:20px;box-shadow:var(--sh)}
.lhead{background:linear-gradient(#2E564D,#21403A);color:var(--chalk);padding:12px 24px;display:flex;align-items:center;gap:14px;border-radius:20px 20px 0 0}
.lhead .ltag{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;background:var(--amber);color:#3A2500;border-radius:6px;padding:2px 8px}
.lhead h3{margin:0;font-family:var(--fH);font-weight:800;font-size:27px}
.ldia{padding:12px 24px 0}
.ldia svg{width:100%;height:auto;max-height:250px;display:block;background:#F8F3E7;border-radius:12px;border:1px solid #E2D7BF}
.ltext{padding:10px 26px 4px;font-size:20.5px;line-height:1.42}

function EYE(x,y,r,o={}){const iris=o.iris||'#5E8C4A',lx=(o.lx??.22)*r,la=o.la??.36;
  let s=`<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r*.9}" fill="url(#g_white)" stroke="${INK}" stroke-width="1.3"/><circle cx="${x+lx}" cy="${y+r*.1}" r="${r*.58}" fill="${iris}"/><circle cx="${x+lx}" cy="${y+r*.1}" r="${r*.58}" fill="url(#g_iris)"/><circle cx="${x+lx}" cy="${y+r*.12}" r="${r*.27}" fill="#0E0B09"/><circle cx="${x+lx-r*.2}" cy="${y-r*.15}" r="${r*.17}" fill="#fff"/>`;

const BROW=(x1,y1,x2,y2,w=4.5,c='#3A2A1E')=>`<path d="M${x1} ${y1} Q${(x1+x2)/2} ${Math.min(y1,y2)-4} ${x2} ${y2}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round"/>`;

const fig=(inner,vb='0 0 140 150')=>`<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" overflow="visible">${inner}</svg>`;
function helix(x1,x2,y,amp=9,per=34,glow=true,w=3){let a='',b='',r='';const cols=['#8CCB71','#EE8A7E','#F1C34E','#81B8E6'];
  for(let x=x1,i=0;x<=x2;x+=2,i++){const t=(x-x1)/per*Math.PI*2;a+=(i?'L':'M')+x+' '+(y+Math.sin(t)*amp).toFixed(1);b+=(i?'L':'M')+x+' '+(y-Math.sin(t)*amp).toFixed(1)}
  for(let x=x1+per/8,k=0;x<x2;x+=per/4,k++){const t=(x-x1)/per*Math.PI*2;const y1=y+Math.sin(t)*amp,y2=y-Math.sin(t)*amp;if(Math.abs(y1-y2)>3)r+=`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${cols[k%4]}" stroke-width="2.4"/>`}
  return `<g ${glow?'filter="url(#glow)"':''}>${r}<path d="${a}" stroke="#5BD3EA" stroke-width="${w}" fill="none"/><path d="${b}" stroke="#A7F0FF" stroke-width="${w}" fill="none"/></g>`}

function dragify(el,{ghost,onDrop,onTap,sel='[data-drop],.hot,.slot'}){el.style.touchAction='none';
  el.addEventListener('pointerdown',e=>{if(e.button>0)return;e.preventDefault();const pid=e.pointerId,sx=e.clientX,sy=e.clientY;let g=null,over=null;
    const mv=ev=>{if(ev.pointerId!==pid)return;
      if(!g&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>9){g=document.createElement('div');g.className='ghost';g.innerHTML=ghost?ghost():el.innerHTML;g.style.transform=`translate(-50%,-60%) scale(${SCALE}) rotate(-4deg)`;document.body.appendChild(g);el.classList.add('lifted')}
      if(g){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';const t=document.elementFromPoint(ev.clientX,ev.clientY);const o=t&&t.closest(sel);if(o!==over){over&&over.classList.remove('over');over=(o&&o!==el)?o:null;over&&over.classList.add('over')}}};
    const up=ev=>{if(ev.pointerId!==pid)return;removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);over&&over.classList.remove('over');
      if(g){g.remove();el.classList.remove('lifted');const t=document.elementFromPoint(ev.clientX,ev.clientY);onDrop&&onDrop(t?t.closest(sel):null,t,ev)}else if(ev.type==='pointerup')onTap&&onTap(ev)};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)})}

    if(!P&&ln.tail>0){ctx.fillStyle='#FFD877';ctx.font=font(700,17);const n=Math.ceil(ln.tail/25);for(let i=0;i<n;i++)ctx.fillText('A',x-72-i*12,y+6+Math.sin(i+t*8)*3)}
    if(!P)ball(x+66,y,11,'#C9F2EA','#3AAE9C','#0F5148');
    for(const dx of P?[-30,10,45]:[-10,30]){ball(x+dx,y-14,16,'#F7E3C6','#C99A69','#6B4627');ball(x+dx+2,y+5,11,'#FFF8EA','#E8CDA2','#9A7550')}
    ctx.globalAlpha=1;
    for(const n of ln.nuc){const nx=X+n.x,ny=GR-28;ctx.globalAlpha=ln.active?1:.3;const g=ctx.createRadialGradient(nx-8,ny-10,3,nx,ny,26);g.addColorStop(0,'#FFD4D4');g.addColorStop(.55,'#D9434F');g.addColorStop(1,'#741320');ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(nx,ny,26,.5,Math.PI*2-.5);ctx.lineTo(nx,ny);ctx.closePath();ctx.fill();ctx.fillStyle='#2B2D33';ctx.beginPath();ctx.arc(nx+2,ny-6,27,Math.PI*1.1,Math.PI*1.9);ctx.lineTo(nx+2,ny-6);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(nx-5,ny-10,6,4,0,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(nx-6,ny-9,2.5,0,7);ctx.fill();ctx.globalAlpha=1}
    if(!ln.active&&t>=0){const steps=['Transkription','5′-Cap','Spleißen','Poly-A','Export'];const fr=1-ln.re/ln.reT;ctx.fillStyle='rgba(255,253,247,.96)';rr(X+60,296,420,100,14);ctx.fill();
      ctx.fillStyle='#1D1B19';ctx.font=font(700,22);ctx.fillText(P?'Neue mRNA wird transkribiert …':'Im Kern: '+steps[Math.min(4,Math.floor(fr*5))]+' …',X+270,336);
      ctx.fillStyle='#E9DFC9';rr(X+90,354,360,22,11);ctx.fill();ctx.fillStyle=P?'#4E8A3A':'#4A5A9A';rr(X+90,354,360*Math.max(0,Math.min(1,fr)),22,11);ctx.fill()}
    for(const p of ln.pops){ctx.globalAlpha=1-p.t/1.4;ctx.fillStyle='#FFD877';ctx.font=font(800,24,'Bitter, serif');ctx.fillText(p.s,X+270,p.y-p.t*50)}ctx.globalAlpha=1;ctx.restore()}
  function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;if(t>=0&&!over){upd(A,dt);upd(B,dt)}
    draw(A);draw(B);ctx.fillStyle='#0B1614';ctx.fillRect(536,0,8,810);
    ctx.fillStyle='#FFFDF7';rr(470,236,140,64,14);ctx.fill();ctx.fillStyle='#1D1B19';ctx.textAlign='center';ctx.font=font(900,34,'Bitter, serif');ctx.fillText(t<0?Math.ceil(-t):Math.max(0,Math.ceil(DUR-t))+' s',540,280);
    if(t<0){ctx.fillStyle='#F3F0E4';ctx.font=font(900,40,'Bitter, serif');ctx.fillText('Bereit machen!',270,470);ctx.fillText('Bereit machen!',810,470)}
    if(t>=DUR&&!over){over=true;results(A,B);return}if(!over&&$('#race').classList.contains('on'))requestAnimationFrame(frame)}
  requestAnimationFrame(frame)}
function results(A,B){const a=Math.floor(A.prot),b=Math.floor(B.prot);S.f.raceDone=1;save();const win=a===b?'Unentschieden!':a>b?'Team Kernlos (Prokaryot) gewinnt!':'Team Zellstadt (Eukaryot) gewinnt!';
  $('#race').insertAdjacentHTML('beforeend',`<div class="rpanel"><h2>${win}</h2><div class="rgrid"><div style="background:#E3F0D6"><b>Prokaryot</b><br><b style="font-size:30px">${a}</b> Proteine<br>${A.loss} mRNAs abgebaut</div>
   <div style="background:#DCE2F2"><b>Eukaryot</b><br><b style="font-size:30px">${b}</b> Proteine<br>${B.shield} Treffer vom Poly-A abgefedert · ${B.loss} mRNAs abgebaut</div></div>
   <div class="rq"><b>Diskutiert zu zweit:</b><br>1. Warum lag Team Kernlos am Anfang vorn?<br>2. Was hat Team Zellstadt geholfen, aufzuholen?<br>3. Wer würde gewinnen, wenn das Rennen 10 Stunden dauert? Begründet!</div>
   <div class="row" style="justify-content:center"><button class="btn primary" id="ragain">Plätze tauschen & nochmal</button><button class="btn" id="rend">Zurück in die Zelle</button></div></div>`);
  $('#ragain').onclick=()=>startRace();$('#rend').onclick=async()=>{$('#race').classList.remove('on');$('#race').innerHTML='';if(!S.f.raceOutro){S.f.raceOutro=1;await say('G','Und? <b>Kernlos glücklich?</b> … Kommt drauf an, ne? Genau das ist die Antwort für die Klausur. Aber bitte mit Begründung.')}render()}}

/* ---------- 14. TITEL, MENÜ, START ---------- */
function renderTitle(){const Tt=$('#title');const sv=loadSave();['#hud','#inv','#btnG'].forEach(s=>$(s).style.display='none');
  Tt.innerHTML=`<svg class="doodle" viewBox="0 0 1080 810"><g fill="none" stroke="#F3F0E4" stroke-linecap="round" opacity=".18" stroke-width="2.5">
     <path d="M40 690 q40 -40 80 0 t80 0 t80 0 t80 0 t80 0"/><path d="M40 714 q40 40 80 0 t80 0 t80 0 t80 0 t80 0"/>${[...Array(11)].map((_,i)=>`<path d="M${60+i*40} ${690+Math.sin(i)*6} v24"/>`).join('')}
     <ellipse cx="120" cy="110" rx="70" ry="48"/><ellipse cx="128" cy="112" rx="24" ry="18"/><circle cx="96" cy="92" r="5"/><circle cx="150" cy="130" r="4"/>
     <circle cx="560" cy="70" r="40"/><circle cx="560" cy="70" r="24"/><path d="M520 70h80M560 30v80"/><text x="700" y="80" font-size="30" fill="#F3F0E4" stroke="none" font-family="AMono, monospace">5′-AUG-3′</text></g></svg>
   <div class="tl"><h1>Spleiß<br><span>drauf!</span></h1><div class="subt">Kernlos glücklich?</div>
    <div class="row"><button class="btn primary" id="tnew" style="font-size:24px">▶ Neues Spiel</button>${sv&&sv.scene!=='title'?'<button class="btn amber" id="tcont" style="font-size:24px">Weiterspielen</button>':''}<button class="btn" id="tfs">Vollbild</button></div></div>
   <div class="tr"><div class="bubble">Euer Gequatsche im Kurs war ja nicht mehr auszuhalten. Hab mich daher mal schrumpfen lassen und bin in eine Zelle geflüchtet. Vielleicht hab ich ja hier Ruhe!</div><img class="mgbig" src="${MG_FULL}" alt="Mister G"></div>
   <div class="foot">Ein Bio-LK-Adventure zur Proteinbiosynthese · mit Mister G · Prototyp v0.3</div>`;
  $('#tnew').onclick=newGame;if($('#tcont'))$('#tcont').onclick=()=>{S=Object.assign(fresh(),sv);render()};$('#tfs').onclick=fullscreen}
async function newGame(){S=fresh();S.scene='bakt';save();render();busy=true;
  await say('G','… Na toll. Kaum bin ich weg, lauft ihr mir hinterher. Bis in die Zelle. Dann lernen wir halt hier was.');
  await say('G','Euer Auftrag steht immer hier oben: <b>Gen G7</b> soll zu einem Protein werden – erst im Bakterium, dann in einer Eukaryotenzelle.',{hl:'#task'});
  await say('G','Ihr <b>tippt</b> Dinge an und <b>zieht</b> Figuren dahin, wo sie arbeiten sollen. Gegenstände landen unten im <b>Inventar</b>.',{hl:'#inv'});
  await say('G','Das ist euer <b>ATP</b> – die Energie der Zelle. Erfolge bringen ATP, <b>jeder Fehler kostet welches</b>. Es darf knapp werden.',{hl:'#atp'});
  await say('G','Alles, was ihr entdeckt, landet im <b>Forschungstagebuch</b>. Das ist eure Sicherung.',{hl:'#btnDiary'});
  await say('G','Und wenn nichts mehr geht: Hier sitz ich. Witze gratis, Tipps kosten ATP. Das Leben ist kein Ponyhof.',{hl:'#btnG'});
  await say('G','Erste Station: <b>Club Kernlos</b> – ein Bakterium. Kein Zellkern, kein Türsteher. Rein da.');
  busy=false;arrive('bakt')}
function fullscreen(){const el=document.documentElement;try{(el.requestFullscreen||el.webkitRequestFullscreen).call(el)}catch(e){toast('Tipp: Über „Teilen → Zum Home-Bildschirm“ läuft das Spiel im Vollbild.')}}
function menu(){if(busy)return;const box=openModal(`<h2>Menü</h2><div class="row"><button class="btn" id="m1">Vollbild</button><button class="btn" id="m2">Titelbild</button><button class="btn" id="m3">Lehrkraft-Menü</button></div>
  <p class="sub" style="margin-top:16px">Der Spielstand wird automatisch auf diesem Gerät gespeichert.</p><div id="mt"></div>`,{closable:true});
  $('#m1',box).onclick=fullscreen;$('#m2',box).onclick=()=>{closeModal();save();S.scene='title';render()};
  $('#m3',box).onclick=()=>{$('#mt',box).innerHTML=`<div class="row"><input id="mcode" placeholder="Code" style="font-size:22px;padding:6px 12px;border:2px solid #C9BFA8;border-radius:10px;width:160px"><button class="btn" id="mok">OK</button></div>`;
    $('#mok',box).onclick=()=>{if($('#mcode',box).value.trim().toUpperCase()!=='G7'){toast('Falscher Code.');return}

      $('#j2',box).onclick=()=>{Object.assign(S.f,{baktIntro:1,pTx:1,prokDone:1});['Pt','Pl','Pk','Pp','Pv','Pi'].forEach(c=>S.cards.includes(c)||S.cards.push(c));['transkription','promotor','sd','kopplung','nucleoid'].forEach(l=>S.lex.includes(l)||S.lex.push(l));closeModal();go('kern')};
      $('#j3',box).onclick=()=>{Object.assign(S.f,{baktIntro:1,kernIntro:1,cytoIntro:1,pTx:1,prokDone:1,preM:1,tried:1,transl:1,nucSeen:1});S.m={cap:true,spl:true,pa:true,exp:true};give('mrna');S.cards=Object.keys(CARDS);Object.keys(CARDS).forEach(k=>S.placed[k]=1);S.lex=Object.keys(LEX);closeModal();go('cyto')};
      $('#j4',box).onclick=()=>{addATP(30);toast('+30 ATP')};
      $('#j0',box).onclick=()=>{try{localStorage.removeItem(KEY)}catch(e){}S=fresh();closeModal();render()}}}}
function fit(){SCALE=Math.min(innerWidth/1080,innerHeight/810);$('#stage').style.transform=`translate(-50%,-50%) scale(${SCALE})`}
addEventListener('resize',fit);addEventListener('orientationchange',()=>setTimeout(fit,300));document.addEventListener('gesturestart',e=>e.preventDefault());
$('#btnDiary').onclick=()=>{if(!busy)openDiary()};$('#btnMenu').onclick=menu;$('#btnG').onclick=help;
initDefs();fit();render();
window.G={get S(){return S},SEQ,CODE,translate,anti,go,render,openDiary,startRace,objective,learnCard};
