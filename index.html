:root{--board:#21403A;--board2:#2E564D;--chalk:#F3F0E4;--paper:#FBF7EE;--paper2:#EFE6D3;--ink:#1D1B19;--muted:#6E675C;--teal:#1F8A7A;--teal2:#156257;--amber:#F0B640;--red:#C8424E;--wood:#7A4E2E;
 --fH:"Bitter",Georgia,serif;--fB:"Fira","Avenir Next","Helvetica Neue",Arial,sans-serif;--fM:"AMono",Menlo,"Courier New",monospace;--sh:0 10px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0E1A18;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--fB);color:var(--ink)}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
b,strong{font-weight:700}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:810px;transform-origin:center center;overflow:hidden;background:#1B2E2B}
#scene{position:absolute;inset:0}
#scene>svg{position:absolute;inset:0}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;height:60px;display:flex;align-items:center;gap:10px;padding:0 12px;z-index:20;pointer-events:none;background:linear-gradient(#1A302C,#1A302CE0 70%,#1A302C00)}
#hud>*{pointer-events:auto}
.tag{background:var(--paper);border-radius:12px;padding:3px 14px;font-weight:600;font-size:18px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.3)}
#loc{background:transparent;color:var(--chalk);font-family:var(--fH);font-weight:800;font-size:20px;box-shadow:none;padding:0 6px}
#task{flex:1;overflow:hidden;text-overflow:ellipsis;font-size:17px;background:rgba(251,247,238,.92)}
#atp{background:linear-gradient(#FFD877,#E9A92B);color:#3A2500;font-weight:700}
#atp.low{background:linear-gradient(#FF8C8C,#C8424E);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.hbtn{border:none;background:var(--paper);border-radius:12px;font-weight:700;font-size:18px;padding:6px 14px;box-shadow:0 3px 8px rgba(0,0,0,.3);position:relative;min-height:44px}
.hbtn:active{transform:translateY(2px)}
.badge{position:absolute;top:-9px;right:-9px;background:var(--red);color:#fff;border:2px solid #fff;border-radius:50%;font-size:13px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700}
/* Inventar */
#inv{position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(#6B4428,#4A2E1A);border-top:3px solid #2B1A0E;box-shadow:0 -6px 18px rgba(0,0,0,.4);display:flex;align-items:center;gap:14px;padding:0 150px 0 14px;z-index:20}
#inv .lab{color:#F3DDBF;opacity:.6;font-family:var(--fH);font-weight:800;font-size:13px;letter-spacing:2px;writing-mode:vertical-rl;transform:rotate(180deg)}
.slot{height:74px;min-width:150px;background:linear-gradient(#FFFDF7,#EFE6D3);border-radius:12px;display:flex;align-items:center;gap:8px;padding:4px 12px;position:relative;touch-action:none;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.slot.sel{box-shadow:0 0 0 4px var(--amber),0 4px 10px rgba(0,0,0,.4);transform:translateY(-6px)}
.slot.lifted{opacity:.35}
.slot svg{width:52px;height:46px;flex:none}
.slot .nm{font-weight:700;font-size:16px;line-height:1.05}
.slot .bd{display:flex;gap:4px;margin-top:4px}
.slot .bd span{font-size:12px;font-weight:600;border-radius:6px;padding:0 6px;background:#E2DACA;color:#8a8170}
.slot .bd span.ok{background:#CDEBE4;color:#145A50}
.slot .lupe{position:absolute;right:-12px;top:-14px;width:38px;height:38px;border-radius:50%;border:none;background:#fff;font-size:16px;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.empty{color:#F3DDBF;opacity:.7;font-size:17px;line-height:1.25}
#btnG{position:absolute;right:12px;bottom:8px;width:128px;height:128px;border-radius:50%;border:4px solid #F3F0E4;background:var(--board);z-index:50;padding:0;box-shadow:0 8px 20px rgba(0,0,0,.5);overflow:visible}
#btnG img{width:100%;height:100%;object-fit:cover;border-radius:50%}
#btnG .q{position:absolute;left:-10px;top:-8px;background:linear-gradient(#FFD877,#E9A92B);border-radius:10px;padding:2px 10px;font-weight:700;font-size:16px;transform:rotate(-8deg);box-shadow:0 2px 6px rgba(0,0,0,.4)}
#btnG:active{transform:translateY(3px)}
/* Hotspots */
.hot{position:absolute;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;z-index:5}
.hot .av{width:100%;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;will-change:transform}
.hot .av svg{width:100%;height:100%;overflow:visible}
.hot.npc .av{animation:sway 3.6s ease-in-out infinite}
.hot:nth-child(odd) .av{animation-delay:-1.7s}
.hot .lbl{margin-top:2px;background:rgba(251,247,238,.95);border-radius:8px;padding:1px 10px;font-weight:700;font-size:16px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.35);line-height:1.45}
.hot.zone .lbl{background:rgba(255,236,186,.96)}
.hot.zone::before{content:"";position:absolute;top:2px;right:4px;width:22px;height:22px;border-radius:50%;background:radial-gradient(#fff,#FFD877 45%,transparent 70%);animation:ping 1.8s ease-in-out infinite}
.hot.go .lbl{background:linear-gradient(#25A08E,#156257);color:#fff;font-size:19px;padding:5px 16px}
.hot.target .lbl,.hot.over .lbl{background:var(--amber)}
.hot.over{outline:3px dashed var(--amber);outline-offset:4px;border-radius:14px}
.hot.drag .lbl::after{content:" ✥";opacity:.55}
.hot.lifted{opacity:.3}
.hot:active{transform:scale(.97)}
@keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes ping{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.ghost{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;filter:drop-shadow(0 10px 10px rgba(0,0,0,.45))}
.ghost svg{width:100px;height:106px}
.ghost .lbl,.ghost span,.ghost .nm,.ghost .bd,.ghost .lupe{display:none}
.ghost .av{width:116px;height:124px}
/* Dialog */
#dlgWrap{position:absolute;inset:0;z-index:60;display:none}
#dlgWrap.on{display:block}
#dlg{position:absolute;left:16px;right:16px;bottom:12px;min-height:180px;background:linear-gradient(#FFFDF7,#F4ECDB);border-radius:18px;box-shadow:0 14px 36px rgba(0,0,0,.55);display:flex;gap:18px;padding:16px 22px 34px 16px;border:1px solid #CDBF9F}
#dlgAv{width:148px;height:148px;flex:none;border-radius:14px;background:radial-gradient(#3A6158,#1E3631);overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),0 4px 10px rgba(0,0,0,.3)}
#dlgAv svg,#dlgAv img{width:100%;height:100%;object-fit:cover}
#dlgName{display:inline-block;color:#fff;font-weight:700;font-size:16px;padding:2px 12px;border-radius:8px;letter-spacing:.2px}
#dlgText{font-size:24px;line-height:1.32;margin-top:8px}
#dlgMore{position:absolute;right:22px;bottom:7px;font-size:15px;font-weight:600;opacity:.5}
#dlgChoices{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.choice,.btn{border:none;background:linear-gradient(#FFF6DF,#EADBB8);border-radius:12px;font-weight:700;font-size:20px;padding:9px 20px;box-shadow:0 4px 0 #B8A57E,0 6px 12px rgba(0,0,0,.25);min-height:52px;color:var(--ink)}
.choice{background:linear-gradient(#FFD877,#E9A92B);box-shadow:0 4px 0 #A87412,0 6px 12px rgba(0,0,0,.25)}
.btn.primary{background:linear-gradient(#25A08E,#156257);color:#fff;box-shadow:0 4px 0 #0D3F38,0 6px 12px rgba(0,0,0,.25)}
.btn.warn{background:linear-gradient(#E05A66,#A8303C);color:#fff;box-shadow:0 4px 0 #6E1A24,0 6px 12px rgba(0,0,0,.25)}
.btn.amber{background:linear-gradient(#FFD877,#E9A92B);box-shadow:0 4px 0 #A87412,0 6px 12px rgba(0,0,0,.25)}
.choice:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a7a5a}
.btn:disabled{opacity:.4}
.btn.help{background:#2E564D;color:#fff;box-shadow:0 4px 0 #142A25;font-size:18px}
/* Modal */
#modal{position:absolute;inset:0;z-index:40;background:rgba(8,16,14,.62);display:none;align-items:center;justify-content:center}
#modal.on{display:flex}
.mbox{background:linear-gradient(#FFFDF7,#F5EEDF);border-radius:20px;width:1024px;max-height:786px;padding:0 24px 18px;position:relative;overflow-y:auto;overflow-x:hidden;box-shadow:var(--sh);-webkit-overflow-scrolling:touch}
.mbox h2{margin:0 -24px 10px;padding:12px 70px 10px 24px;font-family:var(--fH);font-weight:800;font-size:28px;line-height:1.15;color:var(--chalk);background:linear-gradient(#2E564D,#21403A);position:sticky;top:0;z-index:4}
.mbox .sub{margin:2px 0 10px;font-size:20px;line-height:1.32}
.mbox .x{position:absolute;right:14px;top:8px;width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.92);font-size:22px;font-weight:700;z-index:6}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
/* Lernkarte */
#learn{position:absolute;inset:0;z-index:58;background:rgba(8,16,14,.7);display:none;align-items:center;justify-content:center}
#learn.on{display:flex}
.lcard{width:900px;max-height:780px;overflow-y:auto;background:linear-gradient(#FFFDF7,#F5EEDF);border-radius:20px;box-shadow:var(--sh)}
.lhead{background:linear-gradient(#2E564D,#21403A);color:var(--chalk);padding:12px 24px;display:flex;align-items:center;gap:14px;border-radius:20px 20px 0 0}
.lhead .ltag{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;background:var(--amber);color:#3A2500;border-radius:6px;padding:2px 8px}
.lhead h3{margin:0;font-family:var(--fH);font-weight:800;font-size:27px}
.ldia{padding:12px 24px 0}
.ldia svg{width:100%;height:auto;max-height:250px;display:block;background:#F8F3E7;border-radius:12px;border:1px solid #E2D7BF}
.ltext{padding:10px 26px 4px;font-size:20.5px;line-height:1.42}

.qbtn{border:none;border-radius:8px;background:rgba(255,255,255,.16);color:#fff;font-weight:700;font-size:14px;padding:5px 9px;white-space:nowrap}
.dseg2{display:flex;align-items:center;justify-content:center;text-align:center;font-family:var(--fM);font-weight:700;font-size:14px;color:#BFF3FF;line-height:1.15;border-right:1px dashed rgba(191,243,255,.35);background:#13312C repeating-linear-gradient(90deg,transparent 0 9px,rgba(91,211,234,.22) 9px 11px)}
.dseg2.prom{background-color:#3B3412;color:#FFE9A6}.dseg2.g7{background-color:#1E4A42;font-family:var(--fB);font-size:17px;color:#fff}

.mt{position:absolute;width:20px;height:28px;border-radius:5px;font-family:var(--fM);font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.25);animation:popin .25s;transition:opacity .25s,transform .25s}
.mt.hl{outline:3px solid var(--red);transform:translateY(-3px)}.mt.sd{box-shadow:0 0 0 3px #4E8A3A inset}.mt.gone{opacity:0;transform:scale(.2) rotate(30deg)}
.mt.over{outline:3px solid var(--amber)}
.token{touch-action:none;filter:drop-shadow(0 6px 6px rgba(0,0,0,.35))}

.float{animation:flt 3s ease-in-out infinite}.float:nth-child(odd){animation-delay:-1.4s}

.rib{transition:left .45s ease-in-out,opacity .6s;pointer-events:auto}.rib svg{width:100%;height:100%;overflow:visible}

#race canvas{position:absolute;inset:0;width:1080px;height:810px;touch-action:none}
.rpanel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:910px;background:linear-gradient(#FFFDF7,#F5EEDF);border-radius:20px;padding:20px 30px;box-shadow:var(--sh);text-align:center}
.rpanel h2{font-family:var(--fH);font-weight:900;font-size:36px;margin:0}
.rpanel p{font-size:20px;line-height:1.32;margin:8px 0}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:12px 0;text-align:left}
.rgrid>div{border-radius:14px;padding:10px 16px;font-size:18px;line-height:1.32}
.rq{text-align:left;font-size:18px;background:#fff;border-radius:12px;padding:8px 16px}
#rotate{display:none;position:fixed;inset:0;z-index:999;background:#13241F;color:var(--chalk);font-size:30px;font-weight:700;align-items:center;justify-content:center;text-align:center;padding:40px;font-family:var(--fB)}
@media (orientation:portrait) and (max-width:1000px){#rotate{display:flex}}
#print{display:none}
@media print{html,body{background:#fff;overflow:visible;height:auto}#stage,#rotate{display:none!important}
 #print{display:block;font-family:var(--fB);color:#000;padding:10mm}#print table{width:100%;border-collapse:collapse;font-size:11pt}
 #print th,#print td{border:1px solid #444;padding:4px 6px;vertical-align:top}#print th{background:#eee}
 #print h1{font-family:var(--fH);font-size:20pt;margin:0}#print h2{font-family:var(--fH);font-size:14pt;margin:14px 0 6px}#print .lx{font-size:10.5pt;margin:0 0 6px}}

const SEQ={

  ex1:'AUGAUUUCUACU',                 // Exon 1: AUG AUU UCU ACU -> Met Ile Ser Thr
  intr:'GUAAGUAUCUAACUUUUCCCAG',      // Intron: GU … Verzweigungs-A (CUAAC) … Pyrimidin-Abschnitt … AG (stark verkürzt!)
  ex2:'GAACGCGGCUAA',                 // Exon 2: GAA CGC GGC UAA -> Glu Arg Gly Stopp
  utr3:'CCAAUAAAGCUUCUCUUUCCCA',      // 3'-UTR mit AAUAAA, Schnitt 14 nt dahinter (nach CA)
  prok:'UAAGGAGGAAUUCAUGAUUUCUACUGAACGCGGCUAACC', // Bakterien-mRNA: Shine-Dalgarno AGGAGG, 5 nt Abstand, AUG …
  promP35:'TTGACA', promP10:'TATAAT', // Bakterien-Promotor: −35- und −10-Region (Konsensus), 17 bp Abstand
  tata:'TATAAA',                      // Eukaryoten: TATA-Box, ca. 25–30 bp vor dem Transkriptionsstart

  altE1:'AUGGCUAAA', altE2:'UGGCAC', altE3:'GAAUUUCGU', altE4:'GGUUAA',

const INTRON_A=SEQ.utr5.length+SEQ.ex1.length, INTRON_B=INTRON_A+SEQ.intr.length-1;

const COMP={A:'T',T:'A',G:'C',C:'G'}, RCOMP={A:'U',U:'A',G:'C',C:'G'};
const toDNA=s=>s.replace(/U/g,'T');

function translate(s){let i=s.indexOf('AUG');if(i<0)return{aa:[],stop:false};const aa=[];for(;i+3<=s.length;i+=3){const x=CODE[s.substr(i,3)];if(x==='*')return{aa,stop:true};aa.push(x);}return{aa,stop:false};}

const LEX={
  transkription:['Transkription – das Gen abschreiben','Die <b>RNA-Polymerase</b> schreibt ein Gen der DNA in eine Arbeitskopie um: die <b>mRNA</b>. Dazu liest sie einen DNA-Strang (den <b>codogenen Strang</b>) und baut die passenden Basen ein – in RNA steht <b>U statt T</b>.','Start ist immer am <b>Promotor</b> vor dem Gen.'],
  promotor:['Promotor – die Startstelle','Vor jedem Gen liegt ein <b>Promotor</b>. Bei Bakterien erkennt ihn der <b>σ-Faktor</b> der RNA-Polymerase an zwei kurzen Sequenzen: <b>TTGACA</b> (−35) und <b>TATAAT</b> (−10).','Jedes Gen hat seinen eigenen Promotor – direkt <b>davor</b>.'],
  kopplung:['Gleichzeitig – typisch Bakterium','Bakterien haben keinen Zellkern. Ribosomen können deshalb schon an die mRNA, <b>während sie noch abgeschrieben wird</b>. Mehrere Ribosomen auf einer mRNA nennt man <b>Polysom</b>.','Transkription und Translation laufen bei Bakterien gleichzeitig.'],
  sd:['Ribosom-Start bei Bakterien','Ribosomen bestehen aus einer <b>kleinen</b> und einer <b>großen Untereinheit</b> (bei Bakterien 30S + 50S = 70S). Zuerst bindet die kleine an den Landeplatz der mRNA: die <b>Shine-Dalgarno-Sequenz</b> (nur A und G, z. B. AGGAGG), kurz <b>vor dem Startcodon AUG</b>. Danach kommt die große dazu.','Erst klein, dann groß – Landeplatz vor dem AUG.'],
  nucleoid:['Nucleoid','Bakterien haben keinen Zellkern. Ihr ringförmiges Chromosom liegt als Knäuel frei im Cytoplasma – im <b>Nucleoid</b>.','Prokaryoten = ohne Zellkern.'],
  plasmid:['Plasmide','Kleine, ringförmige DNA-Moleküle <b>zusätzlich</b> zum Bakterien-Chromosom. Sie tragen oft Bonus-Gene, z. B. eine <b>Antibiotikaresistenz</b>, und können über einen Pilus an andere Bakterien weitergegeben werden (<b>Konjugation</b>).','Plasmid = extra DNA-Ring mit Bonus-Genen.'],
  euktx:['Transkription bei Eukaryoten','Eukaryoten haben einen <b>Zellkern</b> – dort wird abgeschrieben. Die RNA-Polymerase II findet den Start nicht allein: Zuerst binden <b>Transkriptionsfaktoren</b> an den Promotor, erst dann die Polymerase.','Erst Transkriptionsfaktoren, dann Polymerase.'],
  tata:['TATA-Box & TFIID','Die <b>TATA-Box</b> (TATAAA) liegt im Promotor, etwa 25–30 Basen vor dem Start. Der Transkriptionsfaktor <b>TFIID</b> setzt sich wie ein Sattel darauf. Danach kann die RNA-Polymerase II andocken.','Bakterien brauchen das nicht – ihr σ-Faktor erledigt das direkt.'],

function ambient(sc){const r=rng(sc.length*131+7);let h='';const N=sc==='bakt'?24:30;
  const inside=(x,y)=>sc==='kern'?((x-NK.cx)/NK.rx)**2+((y-NK.cy)/NK.ry)**2<.85:sc==='cyto'?((x-CE.cx)/CE.rx)**2+((y-CE.cy)/CE.ry)**2<.85&&((x-NC.cx)/NC.rx)**2+((y-NC.cy)/NC.ry)**2>1.15:((x-525)/440)**2+((y-396)/280)**2<.9;
  const kinds=sc==='kern'?['violet','teal','rose3','rna']:sc==='cyto'?['tan','lav','teal','rna','gold']:['tan','teal','gold','rna'];
  for(let i=0;i<N;i++){let x=0,y=0,t=0;do{x=60+r()*960;y=80+r()*620;t++}while(!inside(x,y)&&t<30);const k=kinds[Math.floor(r()*kinds.length)],sz=(8+r()*14).toFixed(0);
    const svg=k==='rna'?`<svg viewBox="0 0 30 12"><path d="M1 6 q4 -6 7 0 t7 0 t7 0 t7 0" stroke="#C8424E" stroke-width="2.2" fill="none"/></svg>`:k==='tan'?`<svg viewBox="0 0 20 20"><circle cx="10" cy="8" r="7" fill="url(#g_tan)"/><circle cx="11" cy="14" r="5" fill="url(#g_cream)"/></svg>`:`<svg viewBox="0 0 20 20"><circle cx="8" cy="10" r="6" fill="url(#g_${k})"/><circle cx="13" cy="9" r="5" fill="url(#g_${k})"/><circle cx="11" cy="14" r="4" fill="url(#g_${k})"/></svg>`;
    h+=`<div class="ambi" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${k==='rna'?sz*2:sz}px;height:${sz}px;--dx:${((r()-.5)*70).toFixed(0)}px;--dy:${((r()-.5)*50).toFixed(0)}px;animation-duration:${(5+r()*7).toFixed(1)}s;animation-delay:${(-r()*8).toFixed(1)}s">${svg}</div>`}
  return `<div class="amb">${h}</div>`}

  else{opts.push({aa:ok,ac:anti(cod),ok:1});let rf=false;for(const m of muts){if(opts.length>=4)break;const a=CODE[m];if(a==='*'){if(!rf){rf=true;opts.push({rf:1})}continue}if(seen.has(a))continue;seen.add(a);opts.push({aa:a,ac:anti(m)})}}

function codeSunSVG(){const c=300,R=[0,48,104,160,206,296],d=Math.PI/180,a0=-90*d;const col={U:'#F4ABA2',C:'#A9CFEF',A:'#B5DDA2',G:'#F6D985'};

  for(let i=0;i<4;i++){const a1=a0+i*90*d,a2=a1+90*d;o+=seg(R[1],R[2],a1,a2,col[BASES[i]])+txt((a1+a2)/2,(R[1]+R[2])/2,BASES[i],26)}
  for(let i=0;i<16;i++){const a1=a0+i*22.5*d,a2=a1+22.5*d;o+=seg(R[2],R[3],a1,a2,col[BASES[i%4]])+txt((a1+a2)/2,(R[2]+R[3])/2,BASES[i%4],20)}

    if(ln.type==='E'){ln.lock=Math.max(0,ln.lock-dt);if(!ln.order){ln.orderT-=dt;if(ln.orderT<=0){ln.order={k:Math.floor(Math.random()*3),age:0,prog:0,go:false}}}
      else{const o=ln.order;o.age+=dt;if(o.go&&ln.active&&!ln.mir){o.prog+=dt/2;if(o.prog>=1){ln.var++;ln.vset.add(o.k);ln.pops.push({y:440,t:0,s:VAR[o.k][0]+'-Protein geliefert! +5'});ln.order=null;ln.orderT=4+Math.random()*3}}

  function rr(x,y,w,h,rad){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,rad):ctx.rect(x,y,w,h)}

  function draw(ln){const X=ln.x0,P=ln.type==='P';ctx.save();ctx.beginPath();ctx.rect(X,0,540,810);ctx.clip();drawLaneBG(ctx,X,ln.type,Math.max(t,0));
    ctx.fillStyle='#F3F0E4';ctx.textAlign='center';ctx.font=font(800,26,'Bitter, serif');ctx.fillText(P?'TEAM KERNLOS · Prokaryot':'TEAM ZELLSTADT · Eukaryot',X+270,46);
    ctx.font=font(900,64,'Bitter, serif');ctx.fillText(score(ln),X+270,116);ctx.font=font(600,20);ctx.fillText('Punkte',X+270,140);
    ctx.font=font(600,19);ctx.fillText(P?Math.floor(ln.prot)+' Proteine · '+ln.loss+' mRNAs verloren':Math.floor(ln.prot)+' Proteine + '+ln.var+' Varianten ('+ln.vset.size+' Sorten) · Poly-A '+Math.max(0,ln.tail),X+270,172);
    if(P){ctx.fillText('Endonukleasen verscheucht: '+ln.swat,X+270,200)}
    else{VX.forEach((vx,k)=>{const want=ln.order&&ln.order.k===k;ctx.globalAlpha=ln.lock>0?.4:1;ctx.fillStyle=want?VAR[k][1]:'rgba(255,253,247,.18)';rr(vx-65,VY-22,130,44,22);ctx.fill();
      if(want){ctx.strokeStyle='#FFD877';ctx.lineWidth=3;ctx.stroke()}ctx.fillStyle=want?'#fff':'#E8EBFA';ctx.font=font(800,18);ctx.fillText(VAR[k][0]+'-Var.',vx,VY+6);ctx.globalAlpha=1});
      if(ln.order){const o=ln.order;ctx.fillStyle='#FFFDF7';ctx.font=font(800,18);ctx.fillText(o.go?'Wird gespleißt … '+Math.round(o.prog*100)+' %':'Auftrag: '+VAR[o.k][0]+'zelle braucht ihre Variante!',X+270,206)}}
    const y=GR-ln.h-34,x=X+130;ctx.globalAlpha=ln.active?1:.25;
    ctx.strokeStyle='#C8424E';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();for(let i=0;i<=40;i++){const xx=x-60+i*3,yy=y+Math.sin(i/4+t*8)*7;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke();
    if(!P&&ln.tail>0&&(ln.active||ln.tl)){ctx.fillStyle='#FFD877';ctx.font=font(700,17);const n=Math.ceil(ln.tail/25);for(let i=0;i<n;i++)ctx.fillText('A',x-72-i*12,y+6+Math.sin(i+t*8)*3)}
    if(!P&&(ln.active||ln.cap)&&!ln.capOff)ball(x+66,y,11,'#C9F2EA','#3AAE9C','#0F5148');
    if(P&&ln.endo){const e=ln.endo;ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=7;ctx.beginPath();ctx.arc(e.x,e.y,40,0,7);ctx.stroke();ctx.strokeStyle='#FF6B6B';ctx.beginPath();ctx.arc(e.x,e.y,40,-Math.PI/2,-Math.PI/2+Math.PI*2*e.t/1.6);ctx.stroke();
      ball(e.x,e.y,27,'#FFE2B0','#E08A2E','#7A3E08');ctx.strokeStyle='#2B2D33';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(e.x-10,e.y+8);ctx.lineTo(e.x+10,e.y+20);ctx.moveTo(e.x+10,e.y+8);ctx.lineTo(e.x-10,e.y+20);ctx.stroke();ctx.fillStyle='#fff';ctx.font=font(800,12);ctx.fillText('ENDO',e.x,e.y-2);ctx.setLineDash([4,6]);ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(e.x,e.y+30);ctx.lineTo(e.x,GR-34);ctx.stroke();ctx.setLineDash([])}
    if(!P&&ln.mir){const m=ln.mir;ctx.globalAlpha=1;ctx.strokeStyle='#FF8A3D';ctx.lineWidth=7;ctx.beginPath();for(let i=0;i<=12;i++){const xx=m.x-30+i*5,yy=m.y+Math.sin(i/2+t*6)*5;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke();
      ctx.fillStyle='#FFFDF7';rr(m.x-48,m.y-46,96,26,10);ctx.fill();ctx.fillStyle='#B5481A';ctx.font=font(800,14);ctx.fillText('microRNA',m.x,m.y-28);ctx.fillStyle='#FFD877';ctx.font=font(800,16);ctx.fillText('Produktion gestoppt!',m.x+150,m.y-8)}
    for(const dx of P?[-30,10,45]:[-10,30]){ball(x+dx,y-14,16,'#F7E3C6','#C99A69','#6B4627');ball(x+dx+2,y+5,11,'#FFF8EA','#E8CDA2','#9A7550')}
    ctx.globalAlpha=1;
    for(const n of ln.nuc){const nx=X+n.x,ny=GR-28;ctx.globalAlpha=ln.active?1:.3;const g=ctx.createRadialGradient(nx-8,ny-10,3,nx,ny,26);g.addColorStop(0,'#FFD4D4');g.addColorStop(.55,'#D9434F');g.addColorStop(1,'#741320');ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(nx,ny,26,.5,Math.PI*2-.5);ctx.lineTo(nx,ny);ctx.closePath();ctx.fill();ctx.fillStyle='#2B2D33';ctx.beginPath();ctx.arc(nx+2,ny-6,27,Math.PI*1.1,Math.PI*1.9);ctx.lineTo(nx+2,ny-6);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(nx-5,ny-10,6,4,0,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(nx-6,ny-9,2.5,0,7);ctx.fill();ctx.globalAlpha=1}
    if(!ln.active&&t>=0){const fr=1-ln.re/ln.reT;ctx.fillStyle='rgba(255,253,247,.96)';rr(X+40,296,460,100,14);ctx.fill();ctx.fillStyle='#1D1B19';ctx.font=font(700,21);
      if(!P&&ln.ph==='build'){ctx.fillText('Schnell! Kappe → 5′-Ende,',X+270,336);ctx.fillText('Poly-A → 3′-Ende ziehen!',X+270,366);
        ctx.setLineDash([6,5]);ctx.strokeStyle='#FFD877';ctx.lineWidth=3;if(!ln.cap){ctx.beginPath();ctx.arc(RX+66,RY,22,0,7);ctx.stroke()}if(!ln.tl){rr(RX-120,RY-16,70,32,12);ctx.stroke()}ctx.setLineDash([]);
        if(!ln.cap){const k=ln.tok.cap;ball(k.x,k.y,22,'#C9F2EA','#3AAE9C','#0F5148');ctx.fillStyle='#fff';ctx.font=font(700,13);ctx.fillText('m7G',k.x,k.y+5)}
        if(!ln.tl){const k=ln.tok.tail;ctx.fillStyle='#F1C34E';rr(k.x-40,k.y-18,80,36,14);ctx.fill();ctx.fillStyle='#3A2500';ctx.font=font(800,15);ctx.fillText('AAAA…',k.x,k.y+5)}}
      else{ctx.fillText(P?'Neue mRNA wird transkribiert …':ln.ph==='tx'?'Im Kern: Transkription …':'Export durch die Kernpore …',X+270,336);
        ctx.fillStyle='#E9DFC9';rr(X+90,354,360,22,11);ctx.fill();ctx.fillStyle=P?'#4E8A3A':'#4A5A9A';rr(X+90,354,360*Math.max(0,Math.min(1,fr)),22,11);ctx.fill()}}
    for(const p of ln.pops){ctx.globalAlpha=1-p.t/1.4;ctx.fillStyle='#FFD877';ctx.font=font(800,24,'Bitter, serif');ctx.fillText(p.s,X+270,p.y-p.t*50)}ctx.globalAlpha=1;ctx.restore()}
  function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;if(t>=0&&!over){upd(A,dt);upd(B,dt)}
    draw(A);draw(B);ctx.fillStyle='#0B1614';ctx.fillRect(536,0,8,810);
    ctx.fillStyle='#FFFDF7';rr(470,236,140,64,14);ctx.fill();ctx.fillStyle='#1D1B19';ctx.textAlign='center';ctx.font=font(900,34,'Bitter, serif');ctx.fillText(t<0?Math.ceil(-t):Math.max(0,Math.ceil(DUR-t))+' s',540,280);
    if(t<0){ctx.fillStyle='#F3F0E4';ctx.font=font(900,40,'Bitter, serif');ctx.fillText('Bereit machen!',270,470);ctx.fillText('Bereit machen!',810,470)}
    if(t>=DUR&&!over){over=true;results(A,B);return}if(!over&&$('#race').classList.contains('on'))requestAnimationFrame(frame)}
  requestAnimationFrame(frame)}
function results(A,B){const a=Math.floor(A.prot),b=Math.floor(B.prot)+5*B.var;S.f.raceDone=1;save();const win=a===b?'Unentschieden!':a>b?'Team Kernlos (Prokaryot) gewinnt!':'Team Zellstadt (Eukaryot) gewinnt!';
  $('#race').insertAdjacentHTML('beforeend',`<div class="rpanel"><h2>${win}</h2><div class="rgrid"><div style="background:#E3F0D6"><b>Prokaryot</b><br><b style="font-size:30px">${a}</b> Punkte<br>${Math.floor(A.prot)} Proteine (alle gleich) · ${A.loss} mRNAs abgebaut</div>
   <div style="background:#DCE2F2"><b>Eukaryot</b><br><b style="font-size:30px">${b}</b> Punkte<br>${Math.floor(B.prot)} Proteine + <b>${B.var} Varianten</b> (${B.vset.size} verschiedene Sorten aus einem Gen) · ${B.shield} Treffer vom Poly-A abgefedert</div></div>
   <div class="rq"><b>Diskutiert zu zweit:</b><br>1. Warum lag Team Kernlos am Anfang vorn?<br>2. Was hat Team Zellstadt geholfen – und was kann nur Team Zellstadt?<br>3. Warum ist schneller mRNA-Abbau für Bakterien trotzdem sinnvoll?<br>4. Wer würde gewinnen, wenn das Rennen 10 Stunden dauert? Begründet!</div>
   <div class="row" style="justify-content:center"><button class="btn primary" id="ragain">Plätze tauschen & nochmal</button><button class="btn" id="rend">Zurück in die Zelle</button></div></div>`);
  $('#ragain').onclick=()=>startRace();$('#rend').onclick=async()=>{$('#race').classList.remove('on');$('#race').innerHTML='';if(!S.f.raceOutro){S.f.raceOutro=1;await say('G','Und? <b>Kernlos glücklich?</b> … Kommt drauf an, ne? Genau das ist die Antwort für die Klausur. Aber bitte mit Begründung.')}render()}}

/* ---------- 14. TITEL, MENÜ, START ---------- */

  Tt.innerHTML=`<svg class="doodle" viewBox="0 0 1080 810"><g fill="none" stroke="#F3F0E4" stroke-linecap="round" opacity=".18" stroke-width="2.5">
     <path d="M40 690 q40 -40 80 0 t80 0 t80 0 t80 0 t80 0"/><path d="M40 714 q40 40 80 0 t80 0 t80 0 t80 0 t80 0"/>${[...Array(11)].map((_,i)=>`<path d="M${60+i*40} ${690+Math.sin(i)*6} v24"/>`).join('')}
     <ellipse cx="120" cy="110" rx="70" ry="48"/><ellipse cx="128" cy="112" rx="24" ry="18"/><circle cx="96" cy="92" r="5"/><circle cx="150" cy="130" r="4"/>
     <circle cx="560" cy="70" r="40"/><circle cx="560" cy="70" r="24"/><path d="M520 70h80M560 30v80"/><text x="700" y="80" font-size="30" fill="#F3F0E4" stroke="none" font-family="AMono, monospace">5′-AUG-3′</text></g></svg>
   <div class="tl"><h1>Spleiß<br><span>drauf!</span></h1><div class="subt">Kernlos glücklich?</div>
    <div class="row"><button class="btn primary" id="tnew" style="font-size:24px">▶ Neues Spiel</button>${sv&&sv.scene!=='title'?'<button class="btn amber" id="tcont" style="font-size:24px">Weiterspielen</button>':''}<button class="btn" id="tfs">Vollbild</button></div></div>
   <div class="tr"><div class="bubble">Euer Gequatsche im Kurs war ja nicht mehr auszuhalten. Hab mich daher mal schrumpfen lassen und bin in eine Zelle geflüchtet. Vielleicht hab ich ja hier Ruhe!</div><img class="mgbig" src="${MG_FULL}" alt="Mister G"></div>
   <div class="foot">Ein Bio-LK-Adventure zur Proteinbiosynthese · mit Mister G · Prototyp v0.6</div>`;

async function newGame(){S=fresh();S.scene='bakt';save();render();busy=true;
  await say('G','… Na toll. Kaum bin ich weg, lauft ihr mir hinterher. Bis in die Zelle. Dann lernen wir halt hier was.');
  await say('G','Euer Auftrag steht immer hier oben: <b>Gen G7</b> soll zu einem Protein werden – erst im Bakterium, dann in einer Eukaryotenzelle.',{hl:'#task'});
  await say('G','Ihr <b>tippt</b> Dinge an und <b>zieht</b> Figuren und Moleküle dahin, wo sie arbeiten sollen. Zutaten, die ihr findet, landen unten im <b>Inventar</b>.',{hl:'#inv'});
  await say('G','Das ist euer <b>ATP</b> – die Energie der Zelle. Erfolge bringen ATP, <b>jeder Fehler kostet welches</b>. Es darf knapp werden.',{hl:'#atp'});
  await say('G','Alles, was ihr entdeckt, landet im <b>Forschungstagebuch</b>. Am Ende wird es überprüft – das ist eure Sicherung.',{hl:'#btnDiary'});
  await say('G','Und ich? Ich mach hier eigentlich Urlaub. Wenn ihr Hintergrundwissen braucht, tippt auf die <b>Fragezeichen</b> an meinem Kopf. Und wenn euer ATP alle ist, spielen wir <b>Schere, Stein, Papier</b> – um euer Leben. Das Leben ist kein Ponyhof.',{hl:'#btnG'});
  await say('G','Erste Station: <b>Club Kernlos</b> – ein Bakterium. Kein Zellkern, kein Türsteher. Rein da.');
