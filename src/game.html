<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Spleiß drauf!">
<title>Spleiß drauf! – Kernlos glücklich?</title>
<style>
@font-face{font-family:"Bitter";src:url(/*F_BITTER*/) format("woff");font-weight:100 900}
@font-face{font-family:"Fira";src:url(/*F_FR*/) format("woff");font-weight:400}
@font-face{font-family:"Fira";src:url(/*F_FSB*/) format("woff");font-weight:600}
@font-face{font-family:"Fira";src:url(/*F_FB*/) format("woff");font-weight:700}
@font-face{font-family:"AMono";src:url(/*F_MONO*/) format("woff");font-weight:700}
:root{--board:#21403A;--board2:#2E564D;--chalk:#F3F0E4;--paper:#FBF7EE;--paper2:#EFE6D3;--ink:#1D1B19;--muted:#6E675C;--teal:#1F8A7A;--teal2:#156257;--amber:#F0B640;--red:#C8424E;--wood:#7A4E2E;
 --fH:"Bitter",Georgia,serif;--fB:"Fira","Avenir Next","Helvetica Neue",Arial,sans-serif;--fM:"AMono",Menlo,"Courier New",monospace;--sh:0 10px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0E1A18;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:var(--fB);color:var(--ink)}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
b,strong{font-weight:700}
#stage{position:absolute;left:50%;top:50%;width:1080px;height:810px;transform-origin:center center;overflow:hidden;background:#1B2E2B}
#scene{position:absolute;inset:0}
#scene>svg{position:absolute;inset:0}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;height:60px;display:flex;align-items:center;gap:10px;padding:0 12px;z-index:20;pointer-events:none;background:linear-gradient(#1A302C,#1A302CE0 70%,#1A302C00)}
#hud>*{pointer-events:auto}
.tag{background:var(--paper);border-radius:12px;padding:3px 14px;font-weight:600;font-size:18px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.3)}
#loc{background:transparent;color:var(--chalk);font-family:var(--fH);font-weight:800;font-size:20px;box-shadow:none;padding:0 6px}
#task{flex:1;overflow:hidden;text-overflow:ellipsis;font-size:17px;background:rgba(251,247,238,.92)}
#atp{background:linear-gradient(#FFD877,#E9A92B);color:#3A2500;font-weight:700}
#atp.low{background:linear-gradient(#FF8C8C,#C8424E);color:#fff;animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.07)}}
.hbtn{border:none;background:var(--paper);border-radius:12px;font-weight:700;font-size:18px;padding:6px 14px;box-shadow:0 3px 8px rgba(0,0,0,.3);position:relative;min-height:44px}
.hbtn:active{transform:translateY(2px)}
.badge{position:absolute;top:-9px;right:-9px;background:var(--red);color:#fff;border:2px solid #fff;border-radius:50%;font-size:13px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:700}
/* Inventar */
#inv{position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(#6B4428,#4A2E1A);border-top:3px solid #2B1A0E;box-shadow:0 -6px 18px rgba(0,0,0,.4);display:flex;align-items:center;gap:14px;padding:0 150px 0 14px;z-index:20}
#inv .lab{color:#F3DDBF;opacity:.6;font-family:var(--fH);font-weight:800;font-size:13px;letter-spacing:2px;writing-mode:vertical-rl;transform:rotate(180deg)}
.slot{height:74px;min-width:150px;background:linear-gradient(#FFFDF7,#EFE6D3);border-radius:12px;display:flex;align-items:center;gap:8px;padding:4px 12px;position:relative;touch-action:none;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.slot.sel{box-shadow:0 0 0 4px var(--amber),0 4px 10px rgba(0,0,0,.4);transform:translateY(-6px)}
.slot.lifted{opacity:.35}
.slot svg{width:52px;height:46px;flex:none}
.slot .nm{font-weight:700;font-size:16px;line-height:1.05}
.slot .bd{display:flex;gap:4px;margin-top:4px}
.slot .bd span{font-size:12px;font-weight:600;border-radius:6px;padding:0 6px;background:#E2DACA;color:#8a8170}
.slot .bd span.ok{background:#CDEBE4;color:#145A50}
.slot .lupe{position:absolute;right:-12px;top:-14px;width:38px;height:38px;border-radius:50%;border:none;background:#fff;font-size:16px;padding:0;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.empty{color:#F3DDBF;opacity:.7;font-size:17px;line-height:1.25}
#btnG{position:absolute;right:12px;bottom:8px;width:128px;height:128px;border-radius:50%;border:4px solid #F3F0E4;background:var(--board);z-index:50;padding:0;box-shadow:0 8px 20px rgba(0,0,0,.5);overflow:visible}
#btnG img{width:100%;height:100%;object-fit:cover;border-radius:50%}
#btnG .q{position:absolute;left:-10px;top:-8px;background:linear-gradient(#FFD877,#E9A92B);border-radius:10px;padding:2px 10px;font-weight:700;font-size:16px;transform:rotate(-8deg);box-shadow:0 2px 6px rgba(0,0,0,.4)}
#btnG:active{transform:translateY(3px)}
/* Hotspots */
.hot{position:absolute;border:none;background:none;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;z-index:5}
.hot .av{width:100%;flex:1;min-height:0;display:flex;align-items:flex-end;justify-content:center;will-change:transform}
.hot .av svg{width:100%;height:100%;overflow:visible}
.hot.npc .av{animation:sway 3.6s ease-in-out infinite}
.hot:nth-child(odd) .av{animation-delay:-1.7s}
.hot .lbl{margin-top:2px;background:rgba(251,247,238,.95);border-radius:8px;padding:1px 10px;font-weight:700;font-size:16px;white-space:nowrap;box-shadow:0 3px 8px rgba(0,0,0,.35);line-height:1.45}
.hot.zone .lbl{background:rgba(255,236,186,.96)}
.hot.zone::before{content:"";position:absolute;top:2px;right:4px;width:22px;height:22px;border-radius:50%;background:radial-gradient(#fff,#FFD877 45%,transparent 70%);animation:ping 1.8s ease-in-out infinite}
.hot.go .lbl{background:linear-gradient(#25A08E,#156257);color:#fff;font-size:19px;padding:5px 16px}
.hot.target .lbl,.hot.over .lbl{background:var(--amber)}
.hot.over{outline:3px dashed var(--amber);outline-offset:4px;border-radius:14px}
.hot.drag .lbl::after{content:" ✥";opacity:.55}
.hot.lifted{opacity:.3}
.hot:active{transform:scale(.97)}
@keyframes sway{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes ping{0%,100%{opacity:.35;transform:scale(.7)}50%{opacity:1;transform:scale(1.15)}}
.ghost{position:fixed;left:0;top:0;z-index:9999;pointer-events:none;filter:drop-shadow(0 10px 10px rgba(0,0,0,.45))}
.ghost svg{width:100px;height:106px}
.ghost .lbl,.ghost span,.ghost .nm,.ghost .bd,.ghost .lupe{display:none}
.ghost .av{width:116px;height:124px}
/* Dialog */
#dlgWrap{position:absolute;inset:0;z-index:60;display:none}
#dlgWrap.on{display:block}
#dlg{position:absolute;left:16px;right:16px;bottom:12px;min-height:180px;background:linear-gradient(#FFFDF7,#F4ECDB);border-radius:18px;box-shadow:0 14px 36px rgba(0,0,0,.55);display:flex;gap:18px;padding:16px 22px 34px 16px;border:1px solid #CDBF9F}
#dlgAv{width:148px;height:148px;flex:none;border-radius:14px;background:radial-gradient(#3A6158,#1E3631);overflow:hidden;box-shadow:inset 0 0 0 3px rgba(255,255,255,.6),0 4px 10px rgba(0,0,0,.3)}
#dlgAv svg,#dlgAv img{width:100%;height:100%;object-fit:cover}
#dlgName{display:inline-block;color:#fff;font-weight:700;font-size:16px;padding:2px 12px;border-radius:8px;letter-spacing:.2px}
#dlgText{font-size:24px;line-height:1.32;margin-top:8px}
#dlgMore{position:absolute;right:22px;bottom:7px;font-size:15px;font-weight:600;opacity:.5}
#dlgChoices{display:flex;gap:12px;flex-wrap:wrap;margin-top:12px}
.choice,.btn{border:none;background:linear-gradient(#FFF6DF,#EADBB8);border-radius:12px;font-weight:700;font-size:20px;padding:9px 20px;box-shadow:0 4px 0 #B8A57E,0 6px 12px rgba(0,0,0,.25);min-height:52px;color:var(--ink)}
.choice{background:linear-gradient(#FFD877,#E9A92B);box-shadow:0 4px 0 #A87412,0 6px 12px rgba(0,0,0,.25)}
.btn.primary{background:linear-gradient(#25A08E,#156257);color:#fff;box-shadow:0 4px 0 #0D3F38,0 6px 12px rgba(0,0,0,.25)}
.btn.warn{background:linear-gradient(#E05A66,#A8303C);color:#fff;box-shadow:0 4px 0 #6E1A24,0 6px 12px rgba(0,0,0,.25)}
.btn.amber{background:linear-gradient(#FFD877,#E9A92B);box-shadow:0 4px 0 #A87412,0 6px 12px rgba(0,0,0,.25)}
.choice:active,.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a7a5a}
.btn:disabled{opacity:.4}
.btn.help{background:#2E564D;color:#fff;box-shadow:0 4px 0 #142A25;font-size:18px}
/* Modal */
#modal{position:absolute;inset:0;z-index:40;background:rgba(8,16,14,.62);display:none;align-items:center;justify-content:center}
#modal.on{display:flex}
.mbox{background:linear-gradient(#FFFDF7,#F5EEDF);border-radius:20px;width:1024px;max-height:786px;padding:0 24px 18px;position:relative;overflow-y:auto;overflow-x:hidden;box-shadow:var(--sh);-webkit-overflow-scrolling:touch}
.mbox h2{margin:0 -24px 10px;padding:12px 70px 10px 24px;font-family:var(--fH);font-weight:800;font-size:28px;line-height:1.15;color:var(--chalk);background:linear-gradient(#2E564D,#21403A);position:sticky;top:0;z-index:4}
.mbox .sub{margin:2px 0 10px;font-size:20px;line-height:1.32}
.mbox .x{position:absolute;right:14px;top:8px;width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.92);font-size:22px;font-weight:700;z-index:6}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:10px}
/* Lernkarte */
#learn{position:absolute;inset:0;z-index:58;background:rgba(8,16,14,.7);display:none;align-items:center;justify-content:center}
#learn.on{display:flex}
.lcard{width:900px;max-height:780px;overflow-y:auto;background:linear-gradient(#FFFDF7,#F5EEDF);border-radius:20px;box-shadow:var(--sh)}
.lhead{background:linear-gradient(#2E564D,#21403A);color:var(--chalk);padding:12px 24px;display:flex;align-items:center;gap:14px;border-radius:20px 20px 0 0}
.lhead .ltag{font-size:13px;font-weight:700;letter-spacing:2px;text-transform:uppercase;background:var(--amber);color:#3A2500;border-radius:6px;padding:2px 8px}
.lhead h3{margin:0;font-family:var(--fH);font-weight:800;font-size:27px}
.ldia{padding:12px 24px 0}
.ldia svg{width:100%;height:auto;max-height:250px;display:block;background:#F8F3E7;border-radius:12px;border:1px solid #E2D7BF}
.ltext{padding:10px 26px 4px;font-size:20.5px;line-height:1.42}
.ltext .merke{margin-top:10px;background:#E4F3EF;border-left:5px solid var(--teal);padding:8px 14px;border-radius:6px}
.lfoot{padding:8px 24px 18px;display:flex;justify-content:flex-end;gap:12px}
.newc{display:flex;gap:12px;align-items:flex-start;background:#fff;border-radius:12px;padding:10px 14px;margin:8px 0;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.newc .side{flex:none;font-weight:700;font-size:14px;border-radius:6px;padding:3px 8px;color:#fff}
.newc .side.P{background:#4E8A3A}.newc .side.E{background:#4A5A9A}
.newc .mk{font-weight:700;font-size:16px;color:var(--muted)}.newc .tx{font-size:20px;line-height:1.3}
/* Basen */
.tiles{display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.t{width:40px;height:50px;border-radius:9px;font-family:var(--fM);font-weight:700;font-size:25px;display:flex;align-items:center;justify-content:center;background:#fff;transition:transform .15s,opacity .3s;box-shadow:inset 0 -4px 0 rgba(0,0,0,.14),inset 0 2px 0 rgba(255,255,255,.7),0 1px 2px rgba(0,0,0,.25);color:#1D1B19}
.tiles.sm .t{width:31px;height:40px;font-size:20px}
.bA{background:linear-gradient(#C8EBB5,#8CCB71)}.bU,.bT{background:linear-gradient(#FFC9C2,#EE8A7E)}.bG{background:linear-gradient(#FFE9A6,#F1C34E)}.bC{background:linear-gradient(#CBE6FA,#81B8E6)}
.t.sel{outline:4px solid #3D4E9A;outline-offset:-1px;transform:translateY(-5px)}
.t.mark{box-shadow:0 0 0 3px var(--red) inset}
.t.cut{opacity:.15;transform:scale(.7)}
.t.gone{opacity:0;transform:scale(.2) rotate(40deg)}
.t.pop{animation:popin .25s ease-out}
.t.hl{outline:4px solid var(--red);transform:translateY(-5px)}
.end{font-family:var(--fM);font-weight:700;font-size:18px;padding:0 3px}
.cap,.tail{height:50px;border-radius:25px;display:flex;align-items:center;padding:0 12px;font-family:var(--fM);font-weight:700;font-size:17px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.15)}
.tiles.sm .cap,.tiles.sm .tail{height:40px}
.cap{background:linear-gradient(#3BB3A1,#18705F);color:#fff}.tail{background:linear-gradient(#FFE9A6,#F1C34E)}
.more{font-size:24px;font-weight:700;opacity:.5;padding:0 6px}
@keyframes popin{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.say{display:flex;gap:12px;align-items:center;background:#fff;border-radius:14px;padding:8px 14px;margin-top:10px;min-height:76px;font-size:20px;line-height:1.3;box-shadow:0 2px 8px rgba(0,0,0,.12);border-left:6px solid #C9BFA8}
.say .sav{width:62px;height:62px;flex:none;border-radius:10px;overflow:hidden;background:radial-gradient(#3A6158,#1E3631)}
.say .sav svg,.say .sav img{width:100%;height:100%;object-fit:cover}
.say.good{border-left-color:var(--teal);background:#F0FAF7}.say.bad{border-left-color:var(--red);background:#FFF2F2}
.pep{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:8px;min-height:50px}
.bead{border-radius:22px;padding:4px 13px;font-weight:700;font-size:18px;background:radial-gradient(circle at 35% 30%,#F4EEFF,#B7A4E6);box-shadow:0 2px 4px rgba(0,0,0,.25);animation:popin .3s}
.bead.l1{font-family:var(--fH);font-weight:900;font-size:30px;min-width:52px;text-align:center;background:radial-gradient(circle at 35% 30%,#FFF4CF,#EDB43A)}
/* DNA */
.dnabar{display:flex;align-items:stretch;margin:8px 0 6px;border-radius:10px;overflow:hidden;background:#13312C;box-shadow:inset 0 0 0 2px #0B201C}
.dseg{padding:6px 8px;font-family:var(--fM);font-weight:700;font-size:16px;color:#BFF3FF;border-right:1px dashed rgba(191,243,255,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:68px;text-align:center;line-height:1.2;position:relative;background:repeating-linear-gradient(90deg,transparent 0 10px,rgba(91,211,234,.16) 10px 12px)}
.dseg small{font-family:var(--fB);font-weight:600;font-size:13px;color:#FFE9A6}
.dseg.box{background-color:#1F4A43}
.dseg.gene{flex:1;background-color:#1A3D37}
.dseg.over{outline:4px solid var(--amber);outline-offset:-4px}
.dseg.bound{background-color:#6B5414}
.dseg .sit{position:absolute;top:-64px;left:50%;transform:translateX(-50%);width:68px;height:68px;pointer-events:none}
.dseg .sit svg{width:100%;height:100%}
.tray{display:flex;gap:14px;margin:6px 0;align-items:flex-end}
.who{width:124px;height:140px;border:2px dashed #B8A57E;border-radius:14px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;background:#FFFDF7;padding:4px;touch-action:none}
.who svg{width:100px;height:104px;overflow:visible}
.who span{font-weight:700;font-size:15px;line-height:1.1;text-align:center}
.who.used{opacity:.22;pointer-events:none}.who.lifted{opacity:.3}
.traynote{font-size:18px;line-height:1.3;flex:1}
.strandlab{font-size:15px;font-weight:600;margin-top:6px;color:var(--muted)}
.strand{display:flex;gap:1px;position:relative;min-height:34px}
.st{width:23px;height:32px;border-radius:5px;font-family:var(--fM);font-weight:700;font-size:17px;display:flex;align-items:center;justify-content:center;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),0 1px 2px rgba(0,0,0,.2)}
.st.hl{outline:3px solid var(--red);transform:translateY(-3px)}
.st.mark{box-shadow:0 0 0 3px var(--red) inset}
.st.gone{opacity:0;transform:scale(.2) rotate(30deg);transition:all .3s}
.strand.over{outline:3px dashed var(--amber);outline-offset:3px}
.rider{position:absolute;top:-50px;width:58px;height:58px;transition:left .18s linear;pointer-events:none;z-index:2}
.rider svg{width:100%;height:100%;overflow:visible}
/* Translation */
.ribo{display:flex;gap:16px;align-items:flex-end;margin-top:8px}
.site{border-radius:14px;background:#fff;padding:8px 10px;min-width:170px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.site h4{margin:0;font-family:var(--fH);font-weight:800;font-size:18px}
.site.A{border:3px dashed #C9A24A;background:#FFF8E4;min-width:220px}
.site.A.over{outline:4px solid var(--amber)}
.site .cod{display:flex;gap:3px}.site .cod .t{width:44px;height:54px}
.site .ac{font-family:var(--fM);font-weight:700;font-size:20px;letter-spacing:2px}
.pool{display:flex;gap:14px;margin-top:10px;flex-wrap:wrap}
.trna{width:134px;height:160px;border-radius:14px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:none;box-shadow:0 4px 10px rgba(0,0,0,.2)}
.trna svg{width:104px;height:144px}
.trna.lifted{opacity:.3}.trna.no{opacity:.25;pointer-events:none}
.sunwrap{display:none;position:absolute;inset:0;background:rgba(251,247,238,.98);z-index:5;align-items:center;justify-content:center;flex-direction:column}
.sunwrap.on{display:flex}.sunwrap svg{width:560px;height:560px}
.lariat{font-family:var(--fH);font-weight:800;color:var(--red);font-size:21px;animation:popin .4s}
.tap{border:none;border-radius:50%;width:150px;height:150px;background:radial-gradient(circle at 35% 30%,#FFF1C4,#E9A92B);font-family:var(--fH);font-weight:800;font-size:21px;box-shadow:0 6px 0 #A87412,0 10px 18px rgba(0,0,0,.3);touch-action:none}
.tap.on{transform:translateY(5px);box-shadow:0 1px 0 #A87412}
.drop5{min-width:96px;height:56px;border:3px dashed #C9A24A;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:17px;background:#FFF8E4}
.drop5.over{outline:4px solid var(--amber)}
/* Tagebuch */
.tabs{display:flex;gap:10px;margin:0 60px 10px 0}
.tabs button{border:none;background:#E9DFC9;border-radius:10px;font-weight:700;font-size:18px;padding:6px 16px;min-height:46px}
.tabs button.on{background:var(--board);color:var(--chalk)}
table.cmp{width:100%;border-collapse:separate;border-spacing:4px;font-size:15.5px}
table.cmp th{background:var(--board);color:var(--chalk);border-radius:6px;padding:4px 8px;font-family:var(--fH);font-weight:800;font-size:16px}
table.cmp td{border-radius:8px;padding:3px 8px;height:40px;background:#fff;line-height:1.15;box-shadow:0 1px 3px rgba(0,0,0,.12)}
table.cmp td.rowh{background:#E6EEEA;font-weight:700;width:180px}
table.cmp td.ph{color:#A39A88;font-style:italic;background:#F3EEE3}
table.cmp td.open{background:#FFF8E4;outline:2px dashed #C9A24A;outline-offset:-2px}
table.cmp td.filled{background:#E4F3EF}
table.cmp td.wrong{animation:shake .4s;background:#FFD6D6}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.cards{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.card{border:none;border-radius:10px;background:#fff;padding:5px 11px;font-weight:600;font-size:15.5px;max-width:320px;line-height:1.18;box-shadow:0 2px 6px rgba(0,0,0,.2);min-height:44px}
.card.sel{background:var(--amber);transform:translateY(-4px)}
.lexlist .lexitem{background:#fff;border-radius:12px;padding:10px 16px;margin-bottom:10px;box-shadow:0 2px 6px rgba(0,0,0,.12);display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:19px}
.lexitem b{font-family:var(--fH);font-size:20px}
/* Toasts */
#toasts{position:absolute;left:14px;top:66px;right:14px;z-index:70;display:flex;justify-content:center;pointer-events:none}

<script>
"use strict";
/* =========================================================
   SPLEISS DRAUF! – Kernlos glücklich?   Prototyp v0.3
   Ein Bio-LK-Adventure mit Mister G
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KEY='spleiss-drauf-v3';
const MG_FACE='/*MG_FACE*/', MG_FULL='/*MG_FULL*/';
const START_ATP=15, RPS_ATP=12, GAIN=.5, COST=1.5;

/* ---------- 1. GENETIK-DATEN (geprüft: tools/check_sequences.py) ---------- */
const BASES='UCAG';
const AA1='FFLLSSSSYY**CC*WLLLLPPPPHHQQRRRRIIIMTTTTNNKKSSRRVVVVAAAADDEEGGGG';
const CODE={};{let i=0;for(const a of BASES)for(const b of BASES)for(const c of BASES)CODE[a+b+c]=AA1[i++];}
const AAN={F:['Phe','Phenylalanin'],L:['Leu','Leucin'],S:['Ser','Serin'],Y:['Tyr','Tyrosin'],C:['Cys','Cystein'],W:['Trp','Tryptophan'],P:['Pro','Prolin'],H:['His','Histidin'],Q:['Gln','Glutamin'],R:['Arg','Arginin'],I:['Ile','Isoleucin'],M:['Met','Methionin'],T:['Thr','Threonin'],N:['Asn','Asparagin'],K:['Lys','Lysin'],V:['Val','Valin'],A:['Ala','Alanin'],D:['Asp','Asparaginsäure'],E:['Glu','Glutaminsäure'],G:['Gly','Glycin'],'*':['Stopp','Stoppcodon']};
const SEQ={
  utr5:'CCACC',                       // 5'-UTR (Kozak-ähnlich: A an Position −3)
  ex1:'AUGAUUUCUACU',                 // Exon 1: AUG AUU UCU ACU -> Met Ile Ser Thr
  intr:'GUAAGUAUCUAACUUUUCCCAG',      // Intron: GU … Verzweigungs-A (CUAAC) … Pyrimidin-Abschnitt … AG (stark verkürzt!)
  ex2:'GAACGCGGCUAA',                 // Exon 2: GAA CGC GGC UAA -> Glu Arg Gly Stopp
  utr3:'CCAAUAAAGCUUCUCUUUCCCA',      // 3'-UTR mit AAUAAA, Schnitt 14 nt dahinter (nach CA)
  prok:'UAAGGAGGAAUUCAUGAUUUCUACUGAACGCGGCUAACC', // Bakterien-mRNA: Shine-Dalgarno AGGAGG, 5 nt Abstand, AUG …
  promP35:'TTGACA', promP10:'TATAAT', // Bakterien-Promotor: −35- und −10-Region (Konsensus), 17 bp Abstand
  tata:'TATAAA',                      // Eukaryoten: TATA-Box, ca. 25–30 bp vor dem Transkriptionsstart
  // Gen M für alternatives Spleißen: Exonlängen Vielfache von 3 -> Leseraster bleibt bei jeder Variante erhalten
  altE1:'AUGGCUAAA', altE2:'UGGCAC', altE3:'GAAUUUCGU', altE4:'GGUUAA',
  altI1:'GUAAGUCUAACUUUCAG', altI2:'GUGAGUCUAACCUUUAG', altI3:'GUAAGACUAACUCUCAG'
};
SEQ.pre=SEQ.utr5+SEQ.ex1+SEQ.intr+SEQ.ex2+SEQ.utr3;
SEQ.mat=SEQ.utr5+SEQ.ex1+SEQ.ex2+SEQ.utr3;
const INTRON_A=SEQ.utr5.length+SEQ.ex1.length, INTRON_B=INTRON_A+SEQ.intr.length-1;
const START=SEQ.utr5.length, SD_POS=SEQ.prok.indexOf('AGGAGG'), P_START=SEQ.prok.indexOf('AUG');
const COMP={A:'T',T:'A',G:'C',C:'G'}, RCOMP={A:'U',U:'A',G:'C',C:'G'};
const toDNA=s=>s.replace(/U/g,'T');
const templ=s=>[...toDNA(s)].map(b=>COMP[b]).join('');
const anti=c=>[...c].map(b=>RCOMP[b]).join('');
function translate(s){let i=s.indexOf('AUG');if(i<0)return{aa:[],stop:false};const aa=[];for(;i+3<=s.length;i+=3){const x=CODE[s.substr(i,3)];if(x==='*')return{aa,stop:true};aa.push(x);}return{aa,stop:false};}
(function selfTest(){const ok=(c,m)=>{if(!c)console.error('BIO-CHECK FEHLGESCHLAGEN: '+m)};
  ok(CODE.AUG==='M'&&CODE.UGG==='W'&&CODE.UAA==='*'&&CODE.UAG==='*'&&CODE.UGA==='*','Codesonne');
  ok(translate(SEQ.mat).aa.join('')==='MISTERG','reife mRNA');ok(translate(SEQ.prok).aa.join('')==='MISTERG','Bakterien-mRNA');
  ok(SEQ.intr.startsWith('GU')&&SEQ.intr.endsWith('AG'),'Spleißstellen');ok(SEQ.pre.split('AAUAAA').length===2,'Poly-A-Signal');
  ok(P_START-(SD_POS+6)>=5&&P_START-(SD_POS+6)<=10,'Shine-Dalgarno-Abstand');ok(anti('AUG')==='UAC'&&templ('AUG')==='TAC','Basenpaarung')})();

/* ---------- 2. MAL-WERKZEUG: Verläufe, Filter, plastische Moleküle ---------- */
const INK='#2A1E16';
const PAL={orange:['#FFE1C8','#EE8650','#8E3C18'],gold:['#FFF4C4','#EDBE4A','#8A5E0E'],violet:['#EEE6FF','#9B82DA','#46307F'],tan:['#F7E3C6','#C99A69','#6B4627'],cream:['#FFF8EA','#E8CDA2','#9A7550'],
  green:['#E6F7D6','#7FBF5E','#2F6420'],rose:['#FFE3EA','#E68DA0','#8C2E46'],rose2:['#FFD9DF','#D46B80','#782036'],rose3:['#FFEFF2','#F0AFBD','#A14B60'],amber:['#FFF2C6','#F1B842','#8F5C0A'],
  steel:['#E6EEF8','#83A1C4','#30496A'],crimson:['#FFD4D4','#D9434F','#741320'],salmon:['#FFE6D8','#F09574','#8E3F28'],lav:['#F4EEFF','#BBA6E6','#5A468F'],white:['#FFFFFF','#EEEAE2','#A39C90'],
  dark:['#7A7F8A','#373A42','#111216'],cyan:['#E6FCFF','#5BD3EA','#13708A'],brown:['#E8C9A6','#9B6A40','#4A2E16'],teal:['#C9F2EA','#3AAE9C','#0F5148'],skin:['#FFEBD8','#F2C49F','#B5784F'],
  nucleo:['#C9CFEE','#8E97C7','#4E5788'],nucleolus:['#8C7FB5','#4E4280','#231B45'],cyto:['#F3E6CA','#DCC49A','#B49464'],bact:['#E9F4DA','#BFD9A6','#86A970'],matrix:['#FFE5D3','#F2B596','#C77656']};
function initDefs(){let d='';for(const k in PAL){const[l,m,dk]=PAL[k];d+=`<radialGradient id="g_${k}" cx="36%" cy="30%" r="78%"><stop offset="0" stop-color="${l}"/><stop offset=".52" stop-color="${m}"/><stop offset="1" stop-color="${dk}"/></radialGradient>`}
  d+=`<radialGradient id="g_iris" cx="50%" cy="50%" r="50%"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
  <linearGradient id="l_wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9744A"/><stop offset="1" stop-color="#6A4224"/></linearGradient>
  <linearGradient id="l_board" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#335E55"/><stop offset="1" stop-color="#1E3833"/></linearGradient>
  <linearGradient id="l_metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F4F6F8"/><stop offset=".5" stop-color="#A9B0B8"/><stop offset="1" stop-color="#5F666E"/></linearGradient>
  <linearGradient id="l_beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>

let SCALE=1;
function dragify(el,{ghost,onDrop,onTap,sel='[data-drop],.hot,.slot'}){el.style.touchAction='none';
  el.addEventListener('pointerdown',e=>{if(e.button>0)return;e.preventDefault();const pid=e.pointerId,sx=e.clientX,sy=e.clientY;let g=null,over=null;
    const mv=ev=>{if(ev.pointerId!==pid)return;
      if(!g&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>9){g=document.createElement('div');g.className='ghost';g.innerHTML=ghost?ghost():el.innerHTML;g.style.transform=`translate(-50%,-60%) scale(${SCALE}) rotate(-4deg)`;document.body.appendChild(g);el.classList.add('lifted')}
      if(g){g.style.left=ev.clientX+'px';g.style.top=ev.clientY+'px';const t=document.elementFromPoint(ev.clientX,ev.clientY);const o=t&&t.closest(sel);if(o!==over){over&&over.classList.remove('over');over=(o&&o!==el)?o:null;over&&over.classList.add('over')}}};
    const up=ev=>{if(ev.pointerId!==pid)return;removeEventListener('pointermove',mv);removeEventListener('pointerup',up);removeEventListener('pointercancel',up);over&&over.classList.remove('over');
      if(g){g.remove();el.classList.remove('lifted');const t=document.elementFromPoint(ev.clientX,ev.clientY);onDrop&&onDrop(t?t.closest(sel):null,t,ev)}else if(ev.type==='pointerup')onTap&&onTap(ev)};
    addEventListener('pointermove',mv);addEventListener('pointerup',up);addEventListener('pointercancel',up)})}

function ambient(sc){const r=rng(sc.length*131+7);let h='';const N=sc==='bakt'?24:30;
  const inside=(x,y)=>sc==='kern'?((x-NK.cx)/NK.rx)**2+((y-NK.cy)/NK.ry)**2<.85:sc==='cyto'?((x-CE.cx)/CE.rx)**2+((y-CE.cy)/CE.ry)**2<.85&&((x-NC.cx)/NC.rx)**2+((y-NC.cy)/NC.ry)**2>1.15:((x-525)/440)**2+((y-396)/280)**2<.9;
  const kinds=sc==='kern'?['violet','teal','rose3','rna']:sc==='cyto'?['tan','lav','teal','rna','gold']:['tan','teal','gold','rna'];
  for(let i=0;i<N;i++){let x=0,y=0,t=0;do{x=60+r()*960;y=80+r()*620;t++}while(!inside(x,y)&&t<30);const k=kinds[Math.floor(r()*kinds.length)],sz=(8+r()*14).toFixed(0);
    const svg=k==='rna'?`<svg viewBox="0 0 30 12"><path d="M1 6 q4 -6 7 0 t7 0 t7 0 t7 0" stroke="#C8424E" stroke-width="2.2" fill="none"/></svg>`:k==='tan'?`<svg viewBox="0 0 20 20"><circle cx="10" cy="8" r="7" fill="url(#g_tan)"/><circle cx="11" cy="14" r="5" fill="url(#g_cream)"/></svg>`:`<svg viewBox="0 0 20 20"><circle cx="8" cy="10" r="6" fill="url(#g_${k})"/><circle cx="13" cy="9" r="5" fill="url(#g_${k})"/><circle cx="11" cy="14" r="4" fill="url(#g_${k})"/></svg>`;
    h+=`<div class="ambi" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${k==='rna'?sz*2:sz}px;height:${sz}px;--dx:${((r()-.5)*70).toFixed(0)}px;--dy:${((r()-.5)*50).toFixed(0)}px;animation-duration:${(5+r()*7).toFixed(1)}s;animation-delay:${(-r()*8).toFixed(1)}s">${svg}</div>`}
  return `<div class="amb">${h}</div>`}

    $('#ssel',box).innerHTML=a===null?'Auswahl: –':b===null?'Start bei Base '+(a+1)+' – jetzt das Ende antippen':'Auswahl: '+(Math.abs(b-a)+1)+' Basen: <b>'+seq.slice(Math.min(a,b),Math.min(a,b)+2)+'</b>…<b>'+seq.slice(Math.max(a,b)-1,Math.max(a,b)+1)+'</b>';$('#scut',box).disabled=(a===null||b===null)};

      $('#sp',box).innerHTML=`<span class="lariat">➰ Intron als Lasso raus!</span> ${tr.aa.map(x=>`<span class="bead">${AAN[x][0]}</span>`).join('')}<span class="bead">Stopp</span>`;
      sayBox(SS,'snurpy','<b>Zack – Intron raus!</b> Exon 1 und Exon 2 nahtlos verbunden. Probelesen: <b>7 Aminosäuren</b> und ein sauberes Stoppcodon. Exon und hopp!','good');
      S.m.spl=true;CUR=null;save();inv();$('#scut',box).disabled=true;$('#sres',box).disabled=true;Tt.onclick=null;$('#sx',box).textContent='Weiter';$('#sx',box).className='btn primary';
      addATP(10,'Intron herausgespleißt');unlock(['Es','Ps']);return}

function polyAGame(){return new Promise(res=>{const reg=SEQ.ex2+SEQ.utr3,sig=reg.indexOf('AAUAAA');let w=null,n=0,iv=null,ok=false;

   <div class="row"><button class="btn amber" id="aok" disabled>Das ist das Signal!</button>${helpBtn('polya')}<button class="btn" id="ax">Später</button></div>
   <div class="row" id="atap" style="display:none;gap:24px"><button class="tap" id="ahahn">Zapfen<br><small style="font-family:Fira,sans-serif;font-weight:600">gedrückt halten</small></button><div><div style="font-family:Bitter,serif;font-weight:900;font-size:42px"><span id="an">0</span> A</div><div class="tail" id="atail" style="max-width:640px;overflow:hidden">–</div></div></div>
   <div id="as" class="say"></div>`);
  wireHelp(box);const Tt=$('#at',box),AS=$('#as',box);CUR=()=>{clearInterval(iv);closeModal();res()};note('polya');sayBox(AS,'papa','Na, was darf’s sein? Ohne Signal kein Schwanz.');
  Tt.onclick=e=>{const t=e.target.closest('.t');if(!t)return;w=+t.dataset.i;$$('.t',Tt).forEach(x=>{const i=+x.dataset.i;x.classList.toggle('sel',i>=w&&i<w+6)});$('#aok',box).disabled=false};
  $('#ax',box).onclick=()=>{clearInterval(iv);closeModal();res()};
  $('#aok',box).onclick=async()=>{
    if(w!==sig){spend(2);if(!S.f.paw){S.f.paw=1;learnCard('polya',true)}const sel=reg.substr(w,6);sayBox(AS,'papa',(Math.abs(w-sig)<6?'Fast! Aber fang am <b>Anfang</b> des Signals an.':'„<b>'+sel+'</b>“? Das ist nicht mein Signal. Lies nochmal auf der Lernkarte nach.'),'bad');return}
    $('#aok',box).disabled=true;Tt.onclick=null;sayBox(AS,'papa','<b>AAUAAA</b> – Prost! Ich schneide ein Stück dahinter …','good');
    $('#arest',box).textContent='✂';await sleep(800);$('#arest',box).remove();
    $('#asub',box).innerHTML='Jetzt du: <b>Halte den Zapfhahn gedrückt</b> und zapf einen ordentlichen Poly-A-Schwanz. Wie lang? Steht auf der Lernkarte.';
    $('#atap',box).style.display='';sayBox(AS,'papa','Zapf selbst. Ich hab Rücken.');
    const H=$('#ahahn',box),paint=()=>{$('#an',box).textContent=n;$('#atail',box).textContent=n?'A'.repeat(Math.min(n,44))+(n>44?'…':''):'–'};

  function finish(){S.m.pa=true;CUR=null;save();inv();addATP(8,'Poly-A-Schwanz angehängt');unlock(['Ea','Pa']);
    sayBox(AS,'papa','<b>'+n+' A</b> am 3′-Ende – ganz ohne DNA-Vorlage. Perfekt gezapft. Das ist kein Schwanz, das ist eine Lebensversicherung.','good');$('#ax',box).textContent='Weiter';$('#ax',box).className='btn primary'}})}

function poolFor(cod){const ok=CODE[cod];const opts=[];const seen=new Set([ok]);const muts=[];for(let p=0;p<3;p++)for(const b of BASES){if(b===cod[p])continue;muts.push(cod.slice(0,p)+b+cod.slice(p+1))}muts.sort(()=>Math.random()-.5);
  if(ok==='*'){opts.push({rf:1,ok:1});for(const m of muts){if(opts.length>=4)break;const a=CODE[m];if(a==='*'||seen.has(a))continue;seen.add(a);opts.push({aa:a,ac:anti(m)})}}
  else{opts.push({aa:ok,ac:anti(cod),ok:1});let rf=false;for(const m of muts){if(opts.length>=4)break;const a=CODE[m];if(a==='*'){if(!rf){rf=true;opts.push({rf:1})}continue}if(seen.has(a))continue;seen.add(a);opts.push({aa:a,ac:anti(m)})}}
  return opts.sort(()=>Math.random()-.5)}
function translateGame(){return new Promise(res=>{const mat=SEQ.mat,cods=(SEQ.ex1+SEQ.ex2).match(/.../g);let step=-1,wrong=0;
  const box=openModal(`<h2>Ribo & Söhne – Translation</h2><p class="sub" id="tsub">Ribo setzt an der <b>5′-Cap</b> an und rutscht die mRNA entlang, bis er das <b>Startcodon</b> findet. Tippe darauf!</p>
   <div class="tiles sm" id="tt"><div class="cap">m7G</div><span class="end">5′</span>${tilesOf(mat)}<div class="tail">AAAA…</div><span class="end">3′</span></div>
   <div class="ribo" id="rb" style="display:none"><div class="site"><h4>P-Stelle</h4><div class="ac" id="pac">–</div><div style="font-size:14px">wachsende Kette</div></div>
     <div class="site A" id="asite" data-drop="A"><h4>A-Stelle</h4><div class="cod" id="acod"></div><div style="font-size:14px">Codon 5′ → 3′</div></div><div style="flex:1"><div class="pep" id="tp"></div></div></div>
   <div class="pool" id="pool"></div><div id="ts" class="say"></div>
   <div class="row"><button class="btn amber" id="tsun">☀ Codesonne</button>${helpBtn('translation')}<button class="btn" id="tx">Später</button></div>
   <div class="sunwrap" id="sw"><div>${codeSunSVG()}</div><div class="row"><b style="font-size:18px">Lies von innen (1. Base) nach außen (3. Base).</b><button class="btn primary" id="swx">Schließen</button></div></div>`);
  wireHelp(box);const TS=$('#ts',box);CUR=()=>{closeModal();res()};note('translation');
  sayBox(TS,'ribo','Ich bin an der Cap. Jetzt scanne ich … wo ist mein Startsignal?');
  $('#tsun',box).onclick=()=>{$('#sw',box).classList.add('on');learnCard('code')};$('#swx',box).onclick=()=>$('#sw',box).classList.remove('on');$('#tx',box).onclick=()=>{closeModal();res()};
  $('#tt',box).onclick=e=>{const t=e.target.closest('.t');if(!t||step>=0)return;const i=+t.dataset.i;
    if(i>=START&&i<START+3){step=0;for(let k=START;k<START+3;k++)$(`#tt [data-i="${k}"]`,box).classList.add('mark');
      sayBox(TS,'ribo','<b>AUG</b> – Startcodon! Jetzt brauch ich für jedes Codon die passende <b>tRNA</b>. Zieh sie in die <b>A-Stelle</b>. Ihr Anticodon muss zum Codon passen.','good');
      $('#tsub',box).innerHTML='Zieh die passende tRNA in die A-Stelle. Anticodon (3′→5′) paart mit dem Codon (5′→3′): <b>A–U, G–C</b>. Beim Stoppcodon: Freisetzungsfaktor.';$('#rb',box).style.display='';next()}
    else{spend(1);sayBox(TS,'ribo',i<START?'Das ist noch der Anfang vor dem Gen – hier scanne ich nur durch. Ich brauch das <b>Startcodon</b>.':'Hier fang ich nicht an. Ich brauch das <b>erste</b> Startcodon nach der Cap.','bad')}};
  function next(){step++;$$('#tt .t',box).forEach(x=>{const i=+x.dataset.i-START;x.classList.toggle('hl',i>=(step-1)*3&&i<step*3&&step<=cods.length)});
    if(step>cods.length){finish();return}
    const cod=cods[step-1];$('#acod',box).innerHTML=[...cod].map(b=>`<div class="t b${b}">${b}</div>`).join('');const P=$('#pool',box);P.innerHTML='';
    poolFor(cod).forEach(o=>{const d=document.createElement('div');d.className='trna';d.innerHTML=o.rf?rfSVG():trnaSVG(o.aa,o.ac);P.appendChild(d);

        sayBox(TS,'ribo',o.rf?'Ein Freisetzungsfaktor? Das Codon <b>'+cod+'</b> ist doch kein Stoppcodon!':'Anticodon <b>3′-'+o.ac+'-5′</b> passt nicht zu Codon <b>5′-'+cod+'-3′</b>. Prüf Base für Base: A–U, G–C!','bad');if(wrong===1)learnCard('translation',true)}};

  function placed(cod,o){const a=CODE[cod];
    if(a==='*'){sayBox(TS,'ribo','<b>'+cod+' = Stopp.</b> Der Freisetzungsfaktor dockt an, die Kette wird abgelöst – Protein fertig!','good');setTimeout(next,700);return}
    $('#tp',box).insertAdjacentHTML('beforeend',`<span class="bead">${AAN[a][0]}</span>`);$('#pac',box).textContent='3′-'+o.ac+'-5′';
    sayBox(TS,'ribo','<b>5′-'+cod+'-3′ ↔ 3′-'+o.ac+'-5′</b> passt! Die tRNA bringt <b>'+AAN[a][1]+'</b>. Peptidbindung geknüpft – ein Codon weiter.','good');setTimeout(next,650)}
  async function finish(){CUR=null;$('#pool',box).innerHTML='';$('#acod',box).innerHTML='–';sayBox(TS,'ribo','Fertig! Ein Peptid aus 7 Aminosäuren. Jetzt schreib’s mal im <b>Einbuchstabencode</b> …','good');await sleep(1500);
    $('#tp',box).insertAdjacentHTML('beforeend',' <b style="font-size:28px">=</b> '+translate(SEQ.mat).aa.map(a=>`<span class="bead l1">${a}</span>`).join(''));

    S.f.transl=1;save();addATP(12,'Protein MISTERG gebaut');unlock(['Ev']);$('#tx',box).textContent='Weiter';$('#tx',box).className='btn primary'}})}
function codeSunSVG(){const c=300,R=[0,48,104,160,206,296],d=Math.PI/180,a0=-90*d;const col={U:'#F4ABA2',C:'#A9CFEF',A:'#B5DDA2',G:'#F6D985'};
  const P=(a,r)=>[(c+r*Math.cos(a)).toFixed(2),(c+r*Math.sin(a)).toFixed(2)];
  const seg=(r1,r2,a1,a2,f)=>{const[x1,y1]=P(a1,r2),[x2,y2]=P(a2,r2),[x3,y3]=P(a2,r1),[x4,y4]=P(a1,r1);return `<path d="M${x1} ${y1}A${r2} ${r2} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r1} ${r1} 0 0 0 ${x4} ${y4}Z" fill="${f}" stroke="#5a5048" stroke-width="1.2"/>`};
  const txt=(a,r,t,fs,rot)=>{const[x,y]=P(a,r);let deg=a/d;let tr='';if(rot){if(deg>90&&deg<270)deg+=180;tr=` transform="rotate(${deg.toFixed(1)} ${x} ${y})"`}return `<text x="${x}" y="${y}" font-size="${fs}" font-weight="700" text-anchor="middle" dominant-baseline="central"${tr}>${t}</text>`};
  let o=`<circle cx="${c}" cy="${c}" r="${R[1]}" fill="#FFFDF7" stroke="#5a5048" stroke-width="1.5"/><text x="${c}" y="${c-6}" font-size="16" font-weight="700" text-anchor="middle">5′</text><text x="${c}" y="${c+14}" font-size="12" text-anchor="middle">innen</text>`;
  for(let i=0;i<4;i++){const a1=a0+i*90*d,a2=a1+90*d;o+=seg(R[1],R[2],a1,a2,col[BASES[i]])+txt((a1+a2)/2,(R[1]+R[2])/2,BASES[i],26)}
  for(let i=0;i<16;i++){const a1=a0+i*22.5*d,a2=a1+22.5*d;o+=seg(R[2],R[3],a1,a2,col[BASES[i%4]])+txt((a1+a2)/2,(R[2]+R[3])/2,BASES[i%4],20)}
  for(let i=0;i<64;i++){const a1=a0+i*5.625*d,a2=a1+5.625*d;o+=seg(R[3],R[4],a1,a2,col[BASES[i%4]])+txt((a1+a2)/2,(R[3]+R[4])/2,BASES[i%4],13)}
  let k=0,alt=0;while(k<64){const aa=AA1[k];let e=k;while(e+1<64&&AA1[e+1]===aa&&Math.floor((e+1)/4)===Math.floor(k/4))e++;
    const a1=a0+k*5.625*d,a2=a0+(e+1)*5.625*d;const f=aa==='M'?'#8FCB7A':aa==='*'?'#E88A92':(alt++%2?'#FFFDF7':'#ECE5F6');
    o+=seg(R[4],R[5],a1,a2,f)+txt((a1+a2)/2,(R[4]+R[5])/2+4,aa==='M'?'Met ▶Start':aa==='*'?'Stopp':AAN[aa][0],(e-k)>0?15:12,true);k=e+1}
  return `<svg viewBox="0 0 600 600" font-family="Fira, Avenir Next, sans-serif">${o}</svg>`}
async function tapExo(){await say('exo',S.f.nucSeen?'Boah, dieser Poly-A-Schwanz … mir tut der Kiefer weh.':rnd(['Was guckst du? Wir hängen hier nur rum. Und warten auf RNA.','Knabber, knabber … oh, hallo. Wir sind die Exo-Brüder. Wir fangen immer am Ende an. Wie beim Lesen von Krimis.']))}

      if(ln.type==='E'&&ln.active){if(!ln.mir){ln.mirT-=dt;if(ln.mirT<=0)ln.mir={x:ln.x0+150,y:GR-70,t:0}}else{ln.mir.t+=dt;if(ln.mir.t>6){ln.mir=null;ln.mirT=8;ln.pops.push({y:440,t:0,s:'microRNA löst sich wieder …'})}}}}
    if(ln.type==='E'){ln.lock=Math.max(0,ln.lock-dt);if(!ln.order){ln.orderT-=dt;if(ln.orderT<=0){ln.order={k:Math.floor(Math.random()*3),age:0,prog:0,go:false}}}
      else{const o=ln.order;o.age+=dt;if(o.go&&ln.active&&!ln.mir){o.prog+=dt/2;if(o.prog>=1){ln.var++;ln.vset.add(o.k);ln.pops.push({y:440,t:0,s:VAR[o.k][0]+'-Protein geliefert! +5'});ln.order=null;ln.orderT=4+Math.random()*3}}

  function rr(x,y,w,h,rad){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,rad):ctx.rect(x,y,w,h)}

    ctx.fillStyle='#F3F0E4';ctx.textAlign='center';ctx.font=font(800,26,'Bitter, serif');ctx.fillText(P?'TEAM KERNLOS · Prokaryot':'TEAM ZELLSTADT · Eukaryot',X+270,46);

    ctx.font=font(600,19);ctx.fillText(P?Math.floor(ln.prot)+' Proteine · '+ln.loss+' mRNAs verloren':Math.floor(ln.prot)+' Proteine + '+ln.var+' Varianten ('+ln.vset.size+' Sorten) · Poly-A '+Math.max(0,ln.tail),X+270,172);
    if(P){ctx.fillText('Endonukleasen verscheucht: '+ln.swat,X+270,200)}
    else{VX.forEach((vx,k)=>{const want=ln.order&&ln.order.k===k;ctx.globalAlpha=ln.lock>0?.4:1;ctx.fillStyle=want?VAR[k][1]:'rgba(255,253,247,.18)';rr(vx-65,VY-22,130,44,22);ctx.fill();
      if(want){ctx.strokeStyle='#FFD877';ctx.lineWidth=3;ctx.stroke()}ctx.fillStyle=want?'#fff':'#E8EBFA';ctx.font=font(800,18);ctx.fillText(VAR[k][0]+'-Var.',vx,VY+6);ctx.globalAlpha=1});
      if(ln.order){const o=ln.order;ctx.fillStyle='#FFFDF7';ctx.font=font(800,18);ctx.fillText(o.go?'Wird gespleißt … '+Math.round(o.prog*100)+' %':'Auftrag: '+VAR[o.k][0]+'zelle braucht ihre Variante!',X+270,206)}}
    const y=GR-ln.h-34,x=X+130;ctx.globalAlpha=ln.active?1:.25;
    ctx.strokeStyle='#C8424E';ctx.lineWidth=8;ctx.lineCap='round';ctx.beginPath();for(let i=0;i<=40;i++){const xx=x-60+i*3,yy=y+Math.sin(i/4+t*8)*7;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke();
    if(!P&&ln.tail>0&&(ln.active||ln.tl)){ctx.fillStyle='#FFD877';ctx.font=font(700,17);const n=Math.ceil(ln.tail/25);for(let i=0;i<n;i++)ctx.fillText('A',x-72-i*12,y+6+Math.sin(i+t*8)*3)}
    if(!P&&(ln.active||ln.cap)&&!ln.capOff)ball(x+66,y,11,'#C9F2EA','#3AAE9C','#0F5148');
    if(P&&ln.endo){const e=ln.endo;ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=7;ctx.beginPath();ctx.arc(e.x,e.y,40,0,7);ctx.stroke();ctx.strokeStyle='#FF6B6B';ctx.beginPath();ctx.arc(e.x,e.y,40,-Math.PI/2,-Math.PI/2+Math.PI*2*e.t/1.6);ctx.stroke();
      ball(e.x,e.y,27,'#FFE2B0','#E08A2E','#7A3E08');ctx.strokeStyle='#2B2D33';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(e.x-10,e.y+8);ctx.lineTo(e.x+10,e.y+20);ctx.moveTo(e.x+10,e.y+8);ctx.lineTo(e.x-10,e.y+20);ctx.stroke();ctx.fillStyle='#fff';ctx.font=font(800,12);ctx.fillText('ENDO',e.x,e.y-2);ctx.setLineDash([4,6]);ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(e.x,e.y+30);ctx.lineTo(e.x,GR-34);ctx.stroke();ctx.setLineDash([])}
    if(!P&&ln.mir){const m=ln.mir;ctx.globalAlpha=1;ctx.strokeStyle='#FF8A3D';ctx.lineWidth=7;ctx.beginPath();for(let i=0;i<=12;i++){const xx=m.x-30+i*5,yy=m.y+Math.sin(i/2+t*6)*5;i?ctx.lineTo(xx,yy):ctx.moveTo(xx,yy)}ctx.stroke();
      ctx.fillStyle='#FFFDF7';rr(m.x-48,m.y-46,96,26,10);ctx.fill();ctx.fillStyle='#B5481A';ctx.font=font(800,14);ctx.fillText('microRNA',m.x,m.y-28);ctx.fillStyle='#FFD877';ctx.font=font(800,16);ctx.fillText('Produktion gestoppt!',m.x+150,m.y-8)}
    for(const dx of P?[-30,10,45]:[-10,30]){ball(x+dx,y-14,16,'#F7E3C6','#C99A69','#6B4627');ball(x+dx+2,y+5,11,'#FFF8EA','#E8CDA2','#9A7550')}
    ctx.globalAlpha=1;
    for(const n of ln.nuc){const nx=X+n.x,ny=GR-28;ctx.globalAlpha=ln.active?1:.3;const g=ctx.createRadialGradient(nx-8,ny-10,3,nx,ny,26);g.addColorStop(0,'#FFD4D4');g.addColorStop(.55,'#D9434F');g.addColorStop(1,'#741320');ctx.fillStyle=g;
      ctx.beginPath();ctx.arc(nx,ny,26,.5,Math.PI*2-.5);ctx.lineTo(nx,ny);ctx.closePath();ctx.fill();ctx.fillStyle='#2B2D33';ctx.beginPath();ctx.arc(nx+2,ny-6,27,Math.PI*1.1,Math.PI*1.9);ctx.lineTo(nx+2,ny-6);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(nx-5,ny-10,6,4,0,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.arc(nx-6,ny-9,2.5,0,7);ctx.fill();ctx.globalAlpha=1}
    if(!ln.active&&t>=0){const fr=1-ln.re/ln.reT;ctx.fillStyle='rgba(255,253,247,.96)';rr(X+40,296,460,100,14);ctx.fill();ctx.fillStyle='#1D1B19';ctx.font=font(700,21);
      if(!P&&ln.ph==='build'){ctx.fillText('Schnell! Kappe → 5′-Ende,',X+270,336);ctx.fillText('Poly-A → 3′-Ende ziehen!',X+270,366);
        ctx.setLineDash([6,5]);ctx.strokeStyle='#FFD877';ctx.lineWidth=3;if(!ln.cap){ctx.beginPath();ctx.arc(RX+66,RY,22,0,7);ctx.stroke()}if(!ln.tl){rr(RX-120,RY-16,70,32,12);ctx.stroke()}ctx.setLineDash([]);
        if(!ln.cap){const k=ln.tok.cap;ball(k.x,k.y,22,'#C9F2EA','#3AAE9C','#0F5148');ctx.fillStyle='#fff';ctx.font=font(700,13);ctx.fillText('m7G',k.x,k.y+5)}
        if(!ln.tl){const k=ln.tok.tail;ctx.fillStyle='#F1C34E';rr(k.x-40,k.y-18,80,36,14);ctx.fill();ctx.fillStyle='#3A2500';ctx.font=font(800,15);ctx.fillText('AAAA…',k.x,k.y+5)}}
      else{ctx.fillText(P?'Neue mRNA wird transkribiert …':ln.ph==='tx'?'Im Kern: Transkription …':'Export durch die Kernpore …',X+270,336);
        ctx.fillStyle='#E9DFC9';rr(X+90,354,360,22,11);ctx.fill();ctx.fillStyle=P?'#4E8A3A':'#4A5A9A';rr(X+90,354,360*Math.max(0,Math.min(1,fr)),22,11);ctx.fill()}}
    for(const p of ln.pops){ctx.globalAlpha=1-p.t/1.4;ctx.fillStyle='#FFD877';ctx.font=font(800,24,'Bitter, serif');ctx.fillText(p.s,X+270,p.y-p.t*50)}ctx.globalAlpha=1;ctx.restore()}
  function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;if(t>=0&&!over){upd(A,dt);upd(B,dt)}

  requestAnimationFrame(frame)}
function results(A,B){const a=Math.floor(A.prot),b=Math.floor(B.prot)+5*B.var;S.f.raceDone=1;save();const win=a===b?'Unentschieden!':a>b?'Team Kernlos (Prokaryot) gewinnt!':'Team Zellstadt (Eukaryot) gewinnt!';
  $('#race').insertAdjacentHTML('beforeend',`<div class="rpanel"><h2>${win}</h2><div class="rgrid"><div style="background:#E3F0D6"><b>Prokaryot</b><br><b style="font-size:30px">${a}</b> Punkte<br>${Math.floor(A.prot)} Proteine (alle gleich) · ${A.loss} mRNAs abgebaut</div>
   <div style="background:#DCE2F2"><b>Eukaryot</b><br><b style="font-size:30px">${b}</b> Punkte<br>${Math.floor(B.prot)} Proteine + <b>${B.var} Varianten</b> (${B.vset.size} verschiedene Sorten aus einem Gen) · ${B.shield} Treffer vom Poly-A abgefedert</div></div>
   <div class="rq"><b>Diskutiert zu zweit:</b><br>1. Warum lag Team Kernlos am Anfang vorn?<br>2. Was hat Team Zellstadt geholfen – und was kann nur Team Zellstadt?<br>3. Warum ist schneller mRNA-Abbau für Bakterien trotzdem sinnvoll?<br>4. Wer würde gewinnen, wenn das Rennen 10 Stunden dauert? Begründet!</div>

  $('#ragain').onclick=()=>startRace();$('#rend').onclick=async()=>{$('#race').classList.remove('on');$('#race').innerHTML='';if(!S.f.raceOutro){S.f.raceOutro=1;await say('G','Und? <b>Kernlos glücklich?</b> … Kommt drauf an, ne? Genau das ist die Antwort für die Klausur. Aber bitte mit Begründung.')}render()}}

/* ---------- 14. TITEL, MENÜ, START ---------- */

  Tt.innerHTML=`<svg class="doodle" viewBox="0 0 1080 810"><g fill="none" stroke="#F3F0E4" stroke-linecap="round" opacity=".18" stroke-width="2.5">
     <path d="M40 690 q40 -40 80 0 t80 0 t80 0 t80 0 t80 0"/><path d="M40 714 q40 40 80 0 t80 0 t80 0 t80 0 t80 0"/>${[...Array(11)].map((_,i)=>`<path d="M${60+i*40} ${690+Math.sin(i)*6} v24"/>`).join('')}
     <ellipse cx="120" cy="110" rx="70" ry="48"/><ellipse cx="128" cy="112" rx="24" ry="18"/><circle cx="96" cy="92" r="5"/><circle cx="150" cy="130" r="4"/>
     <circle cx="560" cy="70" r="40"/><circle cx="560" cy="70" r="24"/><path d="M520 70h80M560 30v80"/><text x="700" y="80" font-size="30" fill="#F3F0E4" stroke="none" font-family="AMono, monospace">5′-AUG-3′</text></g></svg>
   <div class="tl"><h1>Spleiß<br><span>drauf!</span></h1><div class="subt">Kernlos glücklich?</div>
    <div class="row"><button class="btn primary" id="tnew" style="font-size:24px">▶ Neues Spiel</button>${sv&&sv.scene!=='title'?'<button class="btn amber" id="tcont" style="font-size:24px">Weiterspielen</button>':''}<button class="btn" id="tfs">Vollbild</button></div></div>
   <div class="tr"><div class="bubble">Euer Gequatsche im Kurs war ja nicht mehr auszuhalten. Hab mich daher mal schrumpfen lassen und bin in eine Zelle geflüchtet. Vielleicht hab ich ja hier Ruhe!</div><img class="mgbig" src="${MG_FULL}" alt="Mister G"></div>
   <div class="foot">Ein Bio-LK-Adventure zur Proteinbiosynthese · mit Mister G · Prototyp v0.6</div>`;
  $('#tnew').onclick=newGame;if($('#tcont'))$('#tcont').onclick=()=>{S=Object.assign(fresh(),sv);render()};$('#tfs').onclick=fullscreen}
async function newGame(){S=fresh();S.scene='bakt';save();render();busy=true;
  await say('G','… Na toll. Kaum bin ich weg, lauft ihr mir hinterher. Bis in die Zelle. Dann lernen wir halt hier was.');
  await say('G','Euer Auftrag steht immer hier oben: <b>Gen G7</b> soll zu einem Protein werden – erst im Bakterium, dann in einer Eukaryotenzelle.',{hl:'#task'});
  await say('G','Ihr <b>tippt</b> Dinge an und <b>zieht</b> Figuren und Moleküle dahin, wo sie arbeiten sollen. Zutaten, die ihr findet, landen unten im <b>Inventar</b>.',{hl:'#inv'});
  await say('G','Das ist euer <b>ATP</b> – die Energie der Zelle. Erfolge bringen ATP, <b>jeder Fehler kostet welches</b>. Es darf knapp werden.',{hl:'#atp'});

  await say('G','Erste Station: <b>Club Kernlos</b> – ein Bakterium. Kein Zellkern, kein Türsteher. Rein da.');
